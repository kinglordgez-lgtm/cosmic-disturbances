<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<link rel="manifest" href="./manifest.json">
<title>Cosmic Disturbances</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{--bg:#05070a;--panel:#141923;--line:#566070;--text:#eee9df;--muted:#9198a5;--gold:#d2b778;--red:#d87982;--blue:#79a9ca}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#game{position:relative;width:100%;height:100%;min-height:100dvh;overflow:hidden}
#header{position:absolute;left:3.3vw;top:2.5vh;z-index:30;pointer-events:none}
#title{font-size:clamp(22px,2.6vw,42px);font-weight:800;letter-spacing:1px;white-space:nowrap}
#meta{margin-top:10px;color:var(--muted);font-size:clamp(10px,1.15vw,18px);white-space:nowrap}
#hud{position:absolute;left:3.3vw;top:13vh;z-index:30;font-size:clamp(9px,1vw,15px);line-height:1.55;color:#c8cbd2;pointer-events:none;text-shadow:0 1px 2px #000}
#hud .hp{color:var(--red)}#hud .san{color:var(--blue)}#hud .myth{color:#bd8ddd}
#mapWrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%);width:min(58vw,760px);height:min(76vh,620px);display:flex;align-items:center;justify-content:center;z-index:5}
#map{display:block;image-rendering:pixelated;background:#090c11;border:2px solid #37404d;border-radius:10px;box-shadow:0 0 0 1px #111722,0 16px 50px #0008}
#menuBtn{position:absolute;right:6.6vw;top:2.8vh;width:58px;height:58px;z-index:60;border:2px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);font-size:30px;font-weight:700}
#joy{position:absolute;left:7vw;bottom:7vh;width:168px;height:168px;border:2px solid #465161;border-radius:50%;background:#0d1219cc;z-index:50}
#joy button{position:absolute;width:54px;height:54px;border:2px solid #667183;border-radius:50%;background:#202633;color:var(--text);font:700 22px monospace;padding:0}
#up{left:56px;top:5px}#down{left:56px;bottom:5px}#left{left:5px;top:56px}#right{right:5px;top:56px}#center{left:56px;top:56px;font-size:16px}
#actions{position:absolute;right:6.7vw;bottom:7.3vh;display:flex;align-items:center;gap:14px;z-index:50}
#actions button{width:118px;height:118px;border:2px solid #667183;border-radius:50%;background:#202633;color:var(--text);font:800 16px monospace;padding:4px}
#actions #wait{width:100px;height:100px;font-size:14px}
button:active{filter:brightness(1.35);transform:scale(.97)}
#combat{display:none;position:absolute;left:50%;bottom:3.5vh;transform:translateX(-50%);z-index:80;width:min(56vw,760px);background:#10151eeF;border:2px solid #596477;border-radius:14px;padding:12px;box-shadow:0 12px 40px #000a}
#combatTop{display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:13px;margin-bottom:8px}
#enemyName{font-weight:800;color:#e3bd8f}.bar{height:8px;background:#272d38;border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:#a85e67}
#combatBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#combatBtns button{min-height:46px;border:1px solid #5c6574;border-radius:9px;background:#202633;color:var(--text);font:700 11px monospace}
#message{position:absolute;left:50%;top:15vh;transform:translateX(-50%);z-index:70;min-width:260px;max-width:58vw;padding:8px 12px;border:1px solid #4c5664;border-radius:8px;background:#0e131bcc;color:#d8d9dd;text-align:center;font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s}
#message.show{opacity:1}
#menu{display:none;position:fixed;inset:0;z-index:100;background:#05070af2;padding:6vh 6vw;overflow:auto}
#menu.open{display:block}.menuCard{max-width:980px;margin:auto;background:#11161f;border:2px solid #4b5564;border-radius:18px;padding:18px}.menuTop{display:flex;justify-content:space-between;align-items:center;gap:10px}.menuTop h2{margin:0}.menuTop button,.menuGrid button{border:1px solid #586270;border-radius:10px;background:#202633;color:var(--text);font:700 12px monospace;min-height:48px}.menuTop button{width:120px}.menuGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.sheet{margin-top:16px;border-top:1px solid #39414d;padding-top:12px;font-size:12px;line-height:1.5}.entry{padding:9px 0;border-bottom:1px solid #2c333e}.locked{opacity:.42}.gold{color:var(--gold)}
#rotate{display:none;position:fixed;inset:0;z-index:200;background:#05070a;align-items:center;justify-content:center;text-align:center;padding:30px}
@media (orientation:portrait){#rotate{display:flex}}
@media (orientation:landscape) and (max-height:500px){
 #header{left:3vw;top:2vh}#title{font-size:clamp(20px,2.4vw,34px)}#meta{margin-top:7px}
 #hud{left:3vw;top:14vh;font-size:9px}
 #mapWrap{width:min(56vw,640px);height:72vh;top:51%}
 #joy{left:4.5vw;bottom:3vh;width:148px;height:148px}#joy button{width:48px;height:48px}#up{left:49px}#down{left:49px}#left{top:49px}#right{top:49px}#center{left:49px;top:49px}
 #actions{right:4.6vw;bottom:3.5vh;gap:10px}#actions button{width:94px;height:94px;font-size:13px}#actions #wait{width:82px;height:82px;font-size:11px}
 #menuBtn{right:5vw;top:2vh;width:52px;height:52px}
 #combat{bottom:1.8vh;width:min(54vw,680px);padding:8px}#combatBtns button{min-height:38px}
}
</style>
</head>
<body>
<div id="game">
  <div id="header"><div id="title">☄ COSMIC DISTURBANCES</div><div id="meta">PROTO 0.9 · BLACKWATER · SEED <span id="seed">—</span> · PROF. <span id="depth">0</span></div></div>
  <div id="hud"></div>
  <div id="mapWrap"><canvas id="map"></canvas></div>
  <button id="menuBtn" aria-label="Menu">☰</button>
  <div id="joy"><button id="up">▲</button><button id="left">◀</button><button id="center">◎</button><button id="right">▶</button><button id="down">▼</button></div>
  <div id="actions"><button id="investigate">ENQUÊTER</button><button id="wait">ATTENDRE</button></div>
  <div id="combat"><div id="combatTop"><div><span id="enemyName"></span><div class="bar"><i id="enemyBar"></i></div></div><div id="combatInfo"></div></div><div id="combatBtns"><button id="attack">⚔ ATTAQUER</button><button id="defend">🛡 DÉFENDRE</button><button id="item">🧪 OBJET</button><button id="flee">↩ FUIR</button></div></div>
  <div id="message"></div>
</div>
<div id="menu"><div class="menuCard"><div class="menuTop"><h2>☾ MENU</h2><button id="closeMenu">✕ FERMER</button></div><div class="menuGrid"><button data-page="character">👤 PERSONNAGE</button><button data-page="inventory">🎒 INVENTAIRE</button><button data-page="bestiary">📖 BESTIAIRE</button><button data-page="journal">📝 JOURNAL</button><button data-page="achievements">🏆 SUCCÈS</button><button id="newRun">☠ NOUVELLE RÉALITÉ</button></div><div class="sheet" id="sheet"></div></div></div>
<div id="rotate"><div><div style="font-size:64px">↻</div><h2>MODE HORIZONTAL</h2><p>Tournez l’iPhone pour jouer.</p></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('map'),ctx=canvas.getContext('2d',{alpha:false});
const N=15;
let seed,rng,map,px,py,depth=0,player,enemy=null,battle=false,journal=[],discovered={},ach={};
const foes={Cultiste:{hp:15,atk:4,glyph:'C'},Profond:{hp:22,atk:6,glyph:'P'},Goule:{hp:18,atk:7,glyph:'G'},'Mi-Go':{hp:26,atk:7,glyph:'M'},Byakhee:{hp:30,atk:8,glyph:'B'}};
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function ri(n){return Math.floor(rng()*n)}
function note(s){journal.unshift(s);journal=journal.slice(0,60);toast(s)}
let toastTimer;function toast(s){const m=$('message');m.textContent=s;m.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>m.classList.remove('show'),1700)}
function unlock(s){if(!ach[s]){ach[s]=1;toast('🏆 '+s)}}
function carve(x,y){if(x>0&&y>0&&x<N-1&&y<N-1)map[y][x]=0}
function generateMap(){
 map=Array.from({length:N},()=>Array(N).fill(1));let x=7,y=7;carve(x,y);
 for(let i=0;i<360;i++){let d=ri(4);x=Math.max(1,Math.min(N-2,x+(d===0?1:d===1?-1:0)));y=Math.max(1,Math.min(N-2,y+(d===2?1:d===3?-1:0)));carve(x,y);if(rng()<.23){carve(x+1,y);carve(x-1,y);carve(x,y+1);carve(x,y-1)}}
 let floors=[];for(let yy=1;yy<N-1;yy++)for(let xx=1;xx<N-1;xx++)if(map[yy][xx]===0)floors.push([xx,yy]);
 const take=()=>floors.splice(ri(floors.length),1)[0];[px,py]=take();
 const types=[2,3,4,5];types.forEach(t=>{let q=take();if(q)map[q[1]][q[0]]=t});
 for(let i=0;i<8&&floors.length;i++){let q=take();map[q[1]][q[0]]=6}
}
function resizeCanvas(){
 const wrap=$('mapWrap').getBoundingClientRect();const side=Math.floor(Math.min(wrap.width,wrap.height));
 const dpr=Math.min(devicePixelRatio||1,2);canvas.style.width=side+'px';canvas.style.height=side+'px';canvas.width=Math.floor(side*dpr);canvas.height=Math.floor(side*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);drawMap();
}
function drawMap(){if(!map)return;const size=parseFloat(canvas.style.width)||500,ts=size/N;ctx.fillStyle='#07090d';ctx.fillRect(0,0,size,size);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){let t=map[y][x],c=t===1?'#080a0e':t===6?'#10202a':'#1a1f27';ctx.fillStyle=c;ctx.fillRect(x*ts+1,y*ts+1,ts-2,ts-2);if(t>1&&t<6){ctx.fillStyle=t===2?'#c6b16d':t===3?'#8f7ab7':t===4?'#8c5f52':'#7790a0';ctx.font=`${Math.max(10,ts*.48)}px monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t===2?'▣':t===3?'✦':t===4?'×':'▼',(x+.5)*ts,(y+.53)*ts)}}
 ctx.fillStyle='#f4e7b7';ctx.fillRect(px*ts+ts*.28,py*ts+ts*.22,ts*.44,ts*.56);ctx.fillStyle='#20242d';ctx.fillRect(px*ts+ts*.39,py*ts+ts*.08,ts*.22,ts*.18);
 if(enemy&&battle){ctx.fillStyle='#b75c66';ctx.font=`bold ${Math.max(12,ts*.58)}px monospace`;ctx.fillText('☠',(enemy.x+.5)*ts,(enemy.y+.54)*ts)}
}
function render(){
 $('seed').textContent=seed;$('depth').textContent=depth;
 $('hud').innerHTML=`PV <span class="hp">${player.hp}/${player.maxhp}</span> · SAN <span class="san">${player.san}/${player.maxsan}</span> · MYTHE <span class="myth">${player.myth}%</span><br>Niv. ${player.lvl} · ATQ ${player.atk} · DEF ${player.def} · XP ${player.xp}/10`;
 $('combat').style.display=battle?'block':'none';$('actions').style.display=battle?'none':'flex';$('joy').style.opacity=battle?'.35':'1';
 if(battle){$('enemyName').textContent=enemy.name+'  '+enemy.hp+'/'+enemy.maxhp;$('enemyBar').style.width=Math.max(0,100*enemy.hp/enemy.maxhp)+'%';$('combatInfo').textContent='Vous : '+player.hp+' PV · '+player.san+' SAN'}
 drawMap();
}
function newGame(){seed=100000+Math.floor(Math.random()*900000);rng=mulberry32(seed);depth=0;player={hp:36,maxhp:36,san:34,maxsan:34,myth:0,atk:6,def:1,lvl:1,xp:0,inv:['Vieux revolver','Lampe à pétrole','Bandage']};enemy=null;battle=false;journal=[];generateMap();note('Blackwater vous attend dans la brume.');render();requestAnimationFrame(resizeCanvas)}
function move(dx,dy){if(battle)return;let nx=px+dx,ny=py+dy;if(nx<0||ny<0||nx>=N||ny>=N||map[ny][nx]===1){toast('Passage bloqué.');return}px=nx;py=ny;resolveTile();if(!battle&&rng()<.12)spawnEnemy();render()}
function resolveTile(){let t=map[py][px];if(t===2){map[py][px]=0;player.inv.push('Sel consacré');note('Cache : Sel consacré.')}else if(t===3){map[py][px]=0;player.myth+=4;player.san=Math.max(0,player.san-3);note('Autel impossible : +4% Mythe, -3 SAN.')}else if(t===4){map[py][px]=0;let d=3+ri(5);player.hp-=d;note('Piège : -'+d+' PV.');checkDeath()}else if(t===5){depth++;unlock('Première descente');note('Vous descendez sous Blackwater. Profondeur '+depth+'.');generateMap()}}
function investigate(){if(battle)return;let t=map[py][px];if(t>=2&&t<=5){resolveTile();render();return}let r=rng();if(r<.42)spawnEnemy();else if(r<.68){player.san=Math.max(0,player.san-2);player.myth+=2;note('Une silhouette traverse la brume. -2 SAN.')}else{player.inv.push('Fragment noir');note('Vous trouvez un Fragment noir.')}render()}
function waitTurn(){if(battle)return;if(rng()<.35)spawnEnemy();else note('Vous écoutez Blackwater respirer.');render()}
function spawnEnemy(){let names=Object.keys(foes),name=names[Math.min(names.length-1,ri(Math.min(names.length,3+depth)))],f=foes[name],scale=depth*2;enemy={name,hp:f.hp+scale,maxhp:f.hp+scale,atk:f.atk+Math.floor(depth/2),x:px,y:py};battle=true;discovered[name]=1;note('☠ '+name+' surgit de la brume.');render()}
function enemyTurn(){if(!battle)return;let d=Math.max(1,enemy.atk-player.def+ri(3)-1);player.hp-=d;if(rng()<.32)player.san=Math.max(0,player.san-1);note(enemy.name+' inflige '+d+' dégâts.');checkDeath()}
function attack(){if(!battle)return;let d=player.atk+2+ri(5);enemy.hp-=d;note('Vous infligez '+d+' dégâts.');if(enemy.hp<=0)victory();else enemyTurn();render()}
function defend(){if(!battle)return;player.def+=3;note('Vous vous mettez en garde.');enemyTurn();player.def-=3;render()}
function useItem(){if(!battle)return;let i=player.inv.indexOf('Bandage');if(i>=0){player.inv.splice(i,1);player.hp=Math.min(player.maxhp,player.hp+8);note('Bandage : +8 PV.');enemyTurn()}else{let s=player.inv.indexOf('Sel consacré');if(s>=0&&enemy.name!=='Cultiste'){player.inv.splice(s,1);enemy.hp-=10;note('Sel consacré : 10 dégâts.');if(enemy.hp<=0)victory();else enemyTurn()}else toast('Aucun objet utile.')}render()}
function flee(){if(!battle)return;if(rng()<.65){battle=false;enemy=null;note('Vous fuyez.')}else{note('La fuite échoue.');enemyTurn()}render()}
function victory(){note('Victoire contre '+enemy.name+'. +5 XP.');battle=false;enemy=null;player.xp+=5;unlock('Première victoire');if(player.xp>=10){player.xp-=10;player.lvl++;player.atk++;player.maxhp+=3;player.hp=Math.min(player.maxhp,player.hp+8);note('Niveau '+player.lvl+' atteint.')}}
function checkDeath(){if(player.hp<=0){player.hp=0;battle=false;enemy=null;unlock('Mourir à Blackwater');note('☠ Vous êtes mort. Ouvrez le menu pour une nouvelle réalité.')}}
function menuPage(page){let s='';if(page==='character')s=`<h3>👤 INVESTIGATEUR</h3><div class="entry">Niveau <b>${player.lvl}</b><br>PV ${player.hp}/${player.maxhp} · SAN ${player.san}/${player.maxsan} · MYTHE ${player.myth}%<br>ATQ ${player.atk} · DEF ${player.def}<br><span class="gold">Investigation 65 · Observation 55 · Armes 60 · Occultisme 35</span></div>`;
 else if(page==='inventory')s='<h3>🎒 INVENTAIRE</h3>'+player.inv.map(x=>`<div class="entry">${x}</div>`).join('');
 else if(page==='bestiary')s='<h3>📖 BESTIAIRE</h3>'+Object.keys(foes).map(x=>`<div class="entry ${discovered[x]?'':'locked'}"><b>${discovered[x]?x:'ENTRÉE INCONNUE'}</b><br>${discovered[x]?'Observation enregistrée à Blackwater.':'Aucune donnée.'}</div>`).join('');
 else if(page==='journal')s='<h3>📝 JOURNAL</h3>'+journal.map(x=>`<div class="entry">${x}</div>`).join('');
 else if(page==='achievements')s='<h3>🏆 SUCCÈS</h3>'+['Première victoire','Première descente','Mourir à Blackwater'].map(x=>`<div class="entry ${ach[x]?'':'locked'}">${ach[x]?'✓':'?'} ${x}</div>`).join('');$('sheet').innerHTML=s}
$('up').onclick=()=>move(0,-1);$('down').onclick=()=>move(0,1);$('left').onclick=()=>move(-1,0);$('right').onclick=()=>move(1,0);$('center').onclick=investigate;$('investigate').onclick=investigate;$('wait').onclick=waitTurn;$('attack').onclick=attack;$('defend').onclick=defend;$('item').onclick=useItem;$('flee').onclick=flee;
$('menuBtn').onclick=()=>{$('menu').classList.add('open');menuPage('character')};$('closeMenu').onclick=()=>$('menu').classList.remove('open');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>menuPage(b.dataset.page));$('newRun').onclick=()=>{$('menu').classList.remove('open');newGame()};
addEventListener('resize',()=>requestAnimationFrame(resizeCanvas));addEventListener('orientationchange',()=>setTimeout(resizeCanvas,150));
newGame();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=090').catch(()=>{}))}
</script>
</body></html>
