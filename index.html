<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<link rel="manifest" href="./manifest.json">
<title>Cosmic Disturbances</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#05070a;color:#ece8dd;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}#app{max-width:680px;margin:auto;padding:8px 0 24px}h1{font-size:21px;letter-spacing:1px;margin:4px 0}.sub{font-size:10px;color:#8a8f99}.panel{background:#10131a;border:1px solid #343945;border-radius:10px;padding:9px;margin:7px 0}.stats{font-size:11px;line-height:1.6}.hp{color:#e47e89}.san{color:#78a8cc}.myth{color:#b07ad0}.gold{color:#c6aa70}#map{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;background:#020307;padding:4px;border-radius:7px}.tile{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:15px;border-radius:2px}.floor{background:#1a1d23}.wall{background:#090a0e;color:#30343d}.water{background:#10212a;color:#4f7887}.player{background:#54482d!important;color:#fff}.foe{background:#4a1d27!important;color:#ffb8c0}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}button{min-height:44px;background:#20242d;border:1px solid #4a5060;border-radius:8px;color:#eee;font:inherit;font-size:12px;padding:8px}button:active{background:#343a46;transform:scale(.98)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}#battle{display:none}.title{font-size:15px;color:#e4c18f}.hint{font-size:10px;color:#858994;line-height:1.4}#log{height:155px;overflow:auto;white-space:pre-wrap;font-size:10px;line-height:1.45;color:#c9cad0}#modal{position:fixed;inset:0;background:#03040af2;z-index:9;display:none;align-items:flex-end;justify-content:center;padding:12px}.sheet{width:min(680px,100%);max-height:88vh;overflow:auto;background:#11141b;border:1px solid #484e5b;border-radius:14px;padding:13px}.entry{padding:9px 2px;border-bottom:1px solid #292d37;font-size:11px;line-height:1.5}.locked{opacity:.45}#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#20242d;border:1px solid #555b69;border-radius:8px;padding:8px 12px;font-size:11px;display:none;z-index:12}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
</style>
</head>
<body>
<div id="app">
<h1>☄ COSMIC DISTURBANCES</h1><div class="sub">PROTO 0.4 · BLACKWATER · SEED <span id="seed">—</span></div>
<div class="panel stats" id="stats">Initialisation…</div>
<div class="panel"><div id="map"></div></div>
<div class="panel"><div class="controls"><button onclick="move(0,-1)">▲</button><button onclick="interact()">◉ ENQUÊTER</button><button onclick="move(0,1)">▼</button><button onclick="move(-1,0)">◀</button><button onclick="waitTurn()">ATTENDRE</button><button onclick="move(1,0)">▶</button></div><div class="hint">⌂ maison · ▣ cimetière · ✦ anomalie · ☠ menace</div></div>
<div class="panel" id="battle"><div class="title" id="battleTitle"></div><div id="battleInfo"></div><div class="actions"><button onclick="attack()">⚔ ATTAQUER</button><button onclick="defend()">🛡 DÉFENDRE</button><button onclick="useItem()">🧪 OBJET</button><button onclick="flee()">↩ FUIR</button></div></div>
<div class="panel" id="eventPanel" style="display:none"><div id="eventText"></div><div id="eventChoices"></div></div>
<div class="panel nav"><button onclick="openCodex()">📖 BESTIAIRE</button><button onclick="openItems()">🎒 GUIDE OBJETS</button><button onclick="openAchievements()">🏆 SUCCÈS</button></div>
<div class="panel"><b>Journal d'enquête</b><div id="log"></div></div><div class="panel"><button onclick="newGame()">☠ NOUVELLE RÉALITÉ</button></div>
</div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div><div id="toast"></div>
<script>
"use strict";
let rng,seed,map,px,py,p,battle=false,enemy=null,eventOpen=false;
const bestiary=[
{name:"Cultiste",cat:"Humain",desc:"Fanatique lié à un culte local.",traits:"Tactique, faible isolé."},
{name:"Profond",cat:"Mythe",desc:"Humanoïde amphibie associé aux profondeurs marines.",traits:"Aquatique, robuste, variantes possibles."},
{name:"Goule",cat:"Mythe",desc:"Créature nocturne vivant près des lieux funéraires.",traits:"Rapide, opportuniste."},
{name:"Mi-Go",cat:"Mythe",desc:"Être extraterrestre lié à des sciences incompréhensibles.",traits:"Technologie anormale, grande mobilité."},
{name:"Byakhee",cat:"Mythe",desc:"Créature volante des espaces cosmiques.",traits:"Rapide, rare, imprévisible."},
{name:"Shoggoth",cat:"Mythe",desc:"Masse protoplasmique d'une puissance extrême.",traits:"Très résistante, menace majeure."},
{name:"Chien de Tindalos",cat:"Mythe",desc:"Prédateur lié aux angles et aux géométries impossibles.",traits:"Apparitions atypiques, traque persistante."}
];
const itemDB=[
{name:"Lampe à pétrole",type:"Outil",rarity:"Commun",tags:["feu","lumière"],effect:"Restaure de la SAN en combat.",synergy:"Feu + huile : dégâts environnementaux futurs."},
{name:"Vieux revolver",type:"Arme",rarity:"Commun",tags:["bruit","métal"],effect:"+2 dégâts de base.",synergy:"Bruit peut attirer des ennemis dans les prochaines versions."},
{name:"Fragment noir",type:"Relique",rarity:"Rare",tags:["cosmique","maudit"],effect:"+Mythe lors de la découverte.",synergy:"Cosmique + occulte : futurs rituels et visions."},
{name:"Œil humide",type:"Relique",rarity:"Rare",tags:["profond","organique"],effect:"Butin de créature marine.",synergy:"Profond + lentille : vision des passages noyés."},
{name:"Symbole gravé",type:"Occulte",rarity:"Inhabituel",tags:["occulte","ancien"],effect:"Indice de quêtes et rituels.",synergy:"Occulte + cosmique : accès à des interactions interdites."}
];
let codex=JSON.parse(localStorage.getItem("cd_codex_v04")||"{}");
let itemsSeen=JSON.parse(localStorage.getItem("cd_items_v04")||"{}");
let achievements=JSON.parse(localStorage.getItem("cd_ach_v04")||"{}");
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
function R(n){return Math.floor(rng()*n)}
function saveMeta(){localStorage.setItem("cd_codex_v04",JSON.stringify(codex));localStorage.setItem("cd_items_v04",JSON.stringify(itemsSeen));localStorage.setItem("cd_ach_v04",JSON.stringify(achievements))}
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",1800)}
function log(s){const x=document.getElementById("log");x.textContent=s+"\n"+x.textContent}
function seeItem(name){if(!itemsSeen[name]){itemsSeen[name]=1;saveMeta();toast("🎒 Objet découvert : "+name)}}
function discover(name){if(!codex[name]){codex[name]=1;saveMeta();toast("📖 Bestiaire : "+name);if(Object.keys(codex).length>=3)unlock("Premier catalogue")}}
function unlock(name){if(!achievements[name]){achievements[name]=Date.now();saveMeta();toast("🏆 Succès : "+name)}}
function newGame(){seed=100000+Math.floor(Math.random()*899999);rng=mulberry32(seed);p={hp:34,maxhp:34,san:34,maxsan:34,myth:0,atk:5,def:1,lvl:1,xp:0,turn:0,inv:[{n:"Lampe à pétrole",tag:"feu",uses:2},{n:"Vieux revolver",tag:"bruit",atk:2}]};p.inv.forEach(i=>seeItem(i.n));px=6;py=6;battle=false;enemy=null;eventOpen=false;generateMap();document.getElementById("log").textContent="";log("Nouvelle réalité. Seed "+seed+".");log("Blackwater semble connaître votre nom.");render()}
function generateMap(){map=[];for(let y=0;y<13;y++){const row=[];for(let x=0;x<13;x++){if(x===0||y===0||x===12||y===12)row.push("wall");else row.push(rng()<0.06?"water":"floor")}map.push(row)}[[6,6],[8,3],[6,10],[2,2]].forEach(([x,y])=>map[y][x]="floor")}
function render(){document.getElementById("seed").textContent=seed;const m=document.getElementById("map");m.innerHTML="";for(let y=0;y<13;y++)for(let x=0;x<13;x++){const d=document.createElement("div");d.className="tile "+map[y][x];if(x===px&&y===py){d.className+=" player";d.textContent="☉"}else if(enemy&&x===enemy.x&&y===enemy.y){d.className+=" foe";d.textContent="☠"}else if(x===8&&y===3)d.textContent="⌂";else if(x===6&&y===10)d.textContent="▣";else if(x===2&&y===2)d.textContent="✦";m.appendChild(d)}document.getElementById("stats").innerHTML=`PV <span class="hp">${p.hp}/${p.maxhp}</span> · SAN <span class="san">${p.san}/${p.maxsan}</span> · MYTHE <span class="myth">${p.myth}%</span><br>ATQ ${p.atk} · DEF ${p.def} · Niv. ${p.lvl} · XP ${p.xp}/10<br>🎒 ${p.inv.map(i=>i.n).join(" · ")}`;document.getElementById("battle").style.display=battle?"block":"none";document.getElementById("eventPanel").style.display=eventOpen?"block":"none";if(battle)updateBattle()}
function move(dx,dy){if(battle||eventOpen)return;const nx=px+dx,ny=py+dy;if(nx<1||nx>11||ny<1||ny>11||map[ny][nx]==="wall")return;px=nx;py=ny;turn();render()}
function waitTurn(){if(!battle&&!eventOpen){turn();render()}}
function turn(){p.turn++;const r=rng();if(r<0.12)randomEvent();else if(r<0.21)spawnEnemy();if(p.san<=0){p.hp-=3;p.myth+=3;log("Votre esprit cède. Une voix répond depuis le mur.")}if(p.hp<=0)die()}
function spawnEnemy(){const n=R(100);const name=n<48?"Cultiste":n<76?"Profond":n<91?"Goule":n<97?"Mi-Go":n<99?"Byakhee":"Shoggoth";const stats={"Cultiste":[13,4],"Profond":[20,6],"Goule":[17,7],"Mi-Go":[23,7],"Byakhee":[28,8],"Shoggoth":[45,10]};const s=stats[name];discover(name);enemy={name,hp:s[0],maxhp:s[0],atk:s[1],x:px,y:py};battle=true;log("☠ "+name+" surgit dans la brume.")}
function updateBattle(){document.getElementById("battleTitle").textContent="⚔ "+enemy.name;document.getElementById("battleInfo").innerHTML=`PV ennemi <span class="hp">${enemy.hp}/${enemy.maxhp}</span> · Vous ${p.hp} PV · ${p.san} SAN`}
function enemyTurn(){const d=Math.max(1,enemy.atk-p.def+(rng()<0.18?2:0));p.hp-=d;if(rng()<0.35)p.san=Math.max(0,p.san-2);log(enemy.name+" inflige "+d+" dégâts.");if(p.hp<=0)die()}
function attack(){if(!battle)return;const bonus=p.inv.some(i=>i.tag==="bruit")?2:0;const d=p.atk+bonus+R(4);enemy.hp-=d;log("Attaque : "+d+" dégâts.");if(enemy.hp<=0)victory();else enemyTurn();render()}
function defend(){if(!battle)return;p.def++;log("Vous vous protégez.");enemyTurn();p.def--;render()}
function useItem(){if(!battle)return;const i=p.inv.find(i=>i.tag==="feu");if(i){p.san=Math.min(p.maxsan,p.san+6);i.uses--;log("La lampe repousse les ombres. +6 SAN.");if(i.uses<=0)p.inv.splice(p.inv.indexOf(i),1)}else{p.hp=Math.min(p.maxhp,p.hp+4);log("Vous improvisez un soin. +4 PV.")}enemyTurn();render()}
function flee(){if(!battle)return;if(rng()<0.65){battle=false;log("Vous fuyez dans la brume.")}else{log("La fuite échoue.");enemyTurn()}render()}
function victory(){battle=false;p.xp+=5;p.myth+=2;const loot=rng()<0.5?{n:"Œil humide",tag:"profond"}:{n:"Symbole gravé",tag:"occulte"};p.inv.push(loot);seeItem(loot.n);log("Victoire. Butin : "+loot.n+".");unlock("Première victoire");if(p.xp>=10){p.xp-=10;p.lvl++;p.maxhp+=3;p.hp=p.maxhp;p.atk++;log("⬆ Niveau "+p.lvl+".");unlock("Le prix du savoir")}}
function randomEvent(){const r=rng();if(r<0.35){p.san=Math.max(0,p.san-2);p.myth+=2;log("Une silhouette traverse la brume. -2 SAN.")}else if(r<0.62){p.inv.push({n:"Fragment noir",tag:"cosmique"});seeItem("Fragment noir");p.myth+=3;log("Fragment noir trouvé. +3% Mythe.")}else openEvent("UNE VOIX SOUS TERRE","« N'ouvrez pas la porte. » La voix vient pourtant de derrière vous.","ouvrir","ignorer")}
function openEvent(t,txt,a,b){eventOpen=true;document.getElementById("eventText").innerHTML=`<b>${t}</b><br>${txt}`;const c=document.getElementById("eventChoices");c.innerHTML="";[a,b].forEach(v=>{const q=document.createElement("button");q.textContent=v.toUpperCase();q.onclick=()=>choice(v);c.appendChild(q)});render()}
function choice(v){eventOpen=false;if(v==="ouvrir"||v==="toucher"){p.myth+=5;p.san=Math.max(0,p.san-4);log("La réalité se plie un instant. +5% Mythe, -4 SAN.")}else{p.san=Math.max(0,p.san-1);log("Vous refusez. Quelque chose frappe trois fois.")}render()}
function interact(){if(battle||eventOpen)return;if(px===8&&py===3)openEvent("MAISON ABANDONNÉE","Une spirale est gravée sous la serrure.","ouvrir","ignorer");else if(px===6&&py===10)openEvent("CIMETIÈRE","Une tombe est ouverte de l'intérieur.","ouvrir","ignorer");else if(px===2&&py===2)openEvent("ANOMALIE","Ce symbole n'appartient à aucune constellation humaine.","toucher","ignorer");else{log("Vous enquêtez. Odeur de sel, métal et chair.");if(rng()<0.30)spawnEnemy()}render()}
function die(){battle=false;eventOpen=false;log("☠ VOUS ÊTES MORT. Une nouvelle réalité vous attend.");unlock("Mourir à Blackwater");render()}
function openModal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").style.display="flex"}
function closeModal(){document.getElementById("modal").style.display="none"}
function openCodex(){let s=`<h2>📖 BESTIAIRE — ${Object.keys(codex).length}/${bestiary.length}</h2>`;bestiary.forEach(e=>{const known=!!codex[e.name];s+=`<div class="entry ${known?"":"locked"}"><b>${known?e.name:"ENTRÉE INCONNUE"}</b><br>${known?e.desc:"Vous n'avez pas encore observé cette entité."}${known?`<br><span class="gold">${e.cat}</span> · ${e.traits}`:""}</div>`});openModal(s)}
function openItems(){let s=`<h2>🎒 GUIDE DES OBJETS — ${Object.keys(itemsSeen).length}/${itemDB.length}</h2>`;itemDB.forEach(i=>{const known=!!itemsSeen[i.name];s+=`<div class="entry ${known?"":"locked"}"><b>${known?i.name:"OBJET INCONNU"}</b>${known?`<br><span class="gold">${i.type} · ${i.rarity}</span><br>${i.effect}<br><span class="hint">Tags : ${i.tags.join(", ")}</span><br><b>Synergie :</b> ${i.synergy}`:"<br>Découvrez cet objet en exploration ou en combat."}</div>`});openModal(s)}
function openAchievements(){const list=["Première victoire","Premier catalogue","Le prix du savoir","Mourir à Blackwater"];let s="<h2>🏆 SUCCÈS</h2>";list.forEach(x=>s+=`<div class="entry ${achievements[x]?"":"locked"}"><b>${achievements[x]?"✓":"?"} ${x}</b><br><span class="hint">${achievements[x]?"Débloqué":"Succès à découvrir"}</span></div>`);openModal(s)}
window.addEventListener("error",e=>{document.getElementById("stats").textContent="Erreur JS : "+e.message});
newGame();
</script>
</body></html>
