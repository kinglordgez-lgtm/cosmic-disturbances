<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<link rel="manifest" href="./manifest.json">
<title>Cosmic Disturbances</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#05070a;--panel:#11151d;--line:#4b5566;--text:#eee9df;--muted:#939aaa;--gold:#c7a96b;--hp:#e57c87;--san:#78a9cd;--myth:#b47bd2}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
button{font:inherit;color:var(--text);background:#202632;border:1px solid #657083;border-radius:12px}
#game{position:fixed;inset:0;overflow:hidden}
header{position:absolute;left:18px;top:10px;z-index:20;pointer-events:none}
h1{font-size:clamp(18px,2vw,30px);letter-spacing:2px;margin:0}
#sub{color:var(--muted);font-size:clamp(9px,1vw,13px);margin-top:6px}
#hud{position:absolute;left:18px;top:78px;z-index:20;background:#11151de8;border:1px solid #3d4655;border-radius:12px;padding:8px 11px;font-size:clamp(9px,1vw,14px);line-height:1.45;max-width:34vw}
.hp{color:var(--hp)}.san{color:var(--san)}.myth{color:var(--myth)}.gold{color:var(--gold)}
#mapWrap{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);width:min(62vw,980px);height:min(80dvh,650px);padding:7px;background:#0b0e13;border:1px solid #3d4655;border-radius:16px}
#map{width:100%;height:100%;display:grid;grid-template-columns:repeat(13,1fr);grid-template-rows:repeat(13,1fr);gap:2px}
.tile{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;border-radius:2px;font-size:clamp(9px,1.1vw,17px)}
.wall{background:#090b0f}.floor{background:#1a1e25}.water{background:#102631}.player{background:#5a4b2d!important}.enemy{background:#541e2a!important}.feature{color:#f4eee0}
#menuBtn{position:absolute;right:max(18px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));z-index:40;width:54px;height:46px;font-size:24px}
#joy{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:30;width:152px;height:152px;border:1px solid #596474;border-radius:50%;background:#11151dcc}
#joy button{position:absolute;width:46px;height:46px;border-radius:50%;padding:0;font-size:20px}
#up{left:52px;top:4px}#down{left:52px;bottom:4px}#left{left:4px;top:52px}#right{right:4px;top:52px}#center{left:52px;top:52px;font-size:9px}
#actionBtn{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));z-index:30;width:100px;height:100px;border-radius:50%;font-weight:700;font-size:12px}
#context{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:35;width:min(48vw,680px);max-height:30vh;overflow:auto;background:#11151df4;border:1px solid #4b5566;border-radius:14px;padding:10px;display:none}
#context .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
#context button{min-height:40px}
.overlay{position:fixed;inset:0;z-index:1000;background:#03050aef;display:none;align-items:center;justify-content:center;padding:3vh 4vw}
.overlay.open{display:flex}
.sheet{position:relative;width:min(980px,92vw);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid #596474;border-radius:18px;padding:18px;-webkit-overflow-scrolling:touch}
.close{position:sticky;top:0;float:right;z-index:5;width:48px;height:44px;font-size:22px}
.menuGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;clear:both;margin-top:14px}
.menuGrid button{min-height:54px}
.entry{border-top:1px solid #303744;padding:10px 0;font-size:12px;line-height:1.45}
.entry:first-of-type{border-top:0}
.itemActions{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.itemActions button{min-height:38px;padding:7px 10px}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:7px 20px}.skill{display:grid;grid-template-columns:1fr 40px;gap:6px}.bar{grid-column:1/-1;height:5px;background:#252b35}.bar i{display:block;height:100%;background:#b5bdcc}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:5000;background:#202632;border:1px solid #657083;border-radius:9px;padding:9px 13px;display:none}
#rotate{display:none;position:fixed;inset:0;z-index:9999;background:#05070a;align-items:center;justify-content:center;text-align:center;padding:25px}
@media(orientation:portrait){#rotate{display:flex}}
@media(orientation:landscape) and (max-height:430px){
 #mapWrap{width:min(58vw,850px);height:76dvh}
 #hud{top:62px;font-size:8.5px;max-width:31vw}
 #joy{transform:scale(.86);transform-origin:left bottom}
 #actionBtn{transform:scale(.88);transform-origin:right bottom}
}

.questBox{border:1px solid #4a5361;border-radius:12px;padding:10px;margin:8px 0;background:#0d1118}
.questBox b{color:var(--gold)}
.choiceGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}
.choiceGrid button{min-height:44px}
.npc{background:#26324b!important;color:#f4eee0}
.quest{background:#44351f!important;color:#f4eee0}

</style>
</head>
<body>
<div id="game">
<header><h1>☄ COSMIC DISTURBANCES</h1><div id="sub"></div></header>
<div id="hud"></div>
<div id="mapWrap"><div id="map"></div></div>
<button id="menuBtn">☰</button>
<div id="joy"><button id="up">▲</button><button id="left">◀</button><button id="center">◎</button><button id="right">▶</button><button id="down">▼</button></div>
<button id="actionBtn">ENQUÊTER</button>
<div id="context"></div>
</div>

<div id="mainMenu" class="overlay"><div class="sheet"><button class="close" data-close="mainMenu">✕</button><h2>☾ MENU</h2>
<div class="menuGrid">
<button onclick="openInventory()">🎒 INVENTAIRE</button><button onclick="openCharacter()">👤 PERSONNAGE</button><button onclick="openBestiary()">📖 BESTIAIRE</button>
<button onclick="openGuide()">📚 GUIDE OBJETS</button><button onclick="openAchievements()">🏆 SUCCÈS</button><button onclick="openJournal()">📝 JOURNAL</button><button onclick="openQuest()">❗ QUÊTE</button>
<button onclick="newRun()">☠ NOUVELLE RÉALITÉ</button>
</div></div></div>
<div id="modal" class="overlay"><div class="sheet" id="sheet"><button class="close" data-close="modal">✕</button><div id="sheetContent"></div></div></div>
<div id="toast"></div>
<div id="rotate"><div><div style="font-size:60px">↻</div><h2>MODE HORIZONTAL</h2><p>Tournez l’appareil pour jouer.</p></div></div>

<script>
"use strict";
let seed,rng,map,px,py,player,enemy=null,battle=false,journal=[],codex={},seenItems={},ach={};

const creatures={
 "Cultiste":{hp:13,atk:4,cat:"Humain",desc:"Fanatique humain lié à un culte local."},
 "Profond":{hp:20,atk:6,cat:"Mythe",desc:"Humanoïde amphibie des profondeurs."},
 "Goule":{hp:17,atk:7,cat:"Mythe",desc:"Prédateur nocturne des lieux funéraires."},
 "Mi-Go":{hp:23,atk:7,cat:"Mythe",desc:"Entité extraterrestre aux sciences impossibles."}
};
const itemDB={
 "Lampe à pétrole":{type:"Outil",slot:"outil",rarity:"Commun",desc:"Restaure 6 SAN. Deux charges.",tags:"feu, lumière"},
 "Vieux revolver":{type:"Arme",slot:"arme",rarity:"Commun",desc:"+2 dégâts lorsqu’il est équipé.",tags:"bruit, métal"},
 "Bandage militaire":{type:"Consommable",rarity:"Commun",desc:"Restaure 8 PV.",tags:"soin"},
 "Sel consacré":{type:"Consommable",rarity:"Inhabituel",desc:"Inflige 8 dégâts à une créature du Mythe.",tags:"rituel, sel"},
 "Fragment noir":{type:"Relique",slot:"relique",rarity:"Rare",desc:"Accroît le Mythe au prix de la SAN.",tags:"cosmique, maudit"},
 "Symbole gravé":{type:"Relique",slot:"relique",rarity:"Inhabituel",desc:"Relique occulte équipable.",tags:"occulte, ancien"}
};

const firstM=["Elias","Walter","Edwin","Arthur","Samuel","Thomas","Henry","Nathaniel","Silas","George"];
const firstF=["Clara","Evelyn","Mabel","Helen","Edith","Margaret","Alice","Beatrice","Dorothy","Agnes"];
const lastN=["Ward","Blackwood","Marsh","Gilman","Derby","Carter","Whateley","Armitage","Danforth","Pickman","Waite"];
const jobs=[
 {name:"Détective privé",focus:["Investigation","Armes"]},{name:"Médecin",focus:["Médecine","Psychologie"]},
 {name:"Professeur",focus:["Érudition","Occultisme"]},{name:"Journaliste",focus:["Investigation","Psychologie"]},
 {name:"Marin",focus:["Endurance","Armes"]},{name:"Antiquaire",focus:["Occultisme","Érudition"]},
 {name:"Photographe",focus:["Observation","Investigation"]},{name:"Infirmière",focus:["Médecine","Observation"]}
];
const traits=["Sang-froid","Curieux","Méfiant","Insomniaque","Œil exercé","Volonté de fer","Superstitieux","Cicatrice étrange"];
const skills=["Investigation","Observation","Armes","Médecine","Psychologie","Occultisme","Érudition","Endurance"];

function mulberry(a){return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function R(n){return Math.floor(rng()*n)}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";clearTimeout(t._x);t._x=setTimeout(()=>t.style.display="none",1500)}
function log(s){journal.unshift(s);journal=journal.slice(0,120)}
function closeOverlays(){document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("open"))}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove("open"));
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.classList.remove("open")}));

function makeCharacter(){
 const female=Math.random()<.5,pool=female?firstF:firstM,job=jobs[Math.floor(Math.random()*jobs.length)];
 let v=Object.fromEntries(skills.map(s=>[s,35]));v[job.focus[0]]+=35;v[job.focus[1]]+=25;let rem=60;
 while(rem-->0)v[skills[Math.floor(Math.random()*skills.length)]]++;
 return {name:pool[Math.floor(Math.random()*pool.length)]+" "+lastN[Math.floor(Math.random()*lastN.length)],sex:female?"Femme":"Homme",job:job.name,trait:traits[Math.floor(Math.random()*traits.length)],skills:v}
}
function newRun(){
 closeOverlays();seed=100000+Math.floor(Math.random()*899999);rng=mulberry(seed);
 player={hp:34,maxhp:34,san:34,maxsan:34,myth:0,atk:5,def:1,lvl:1,xp:0,depth:0,char:makeCharacter(),equip:{arme:"Vieux revolver",outil:"Lampe à pétrole",relique:null},inv:[{n:"Lampe à pétrole",uses:2},{n:"Vieux revolver"}],quest:null,reputation:0};
 seenItems["Lampe à pétrole"]=seenItems["Vieux revolver"]=true;enemy=null;battle=false;journal=[];generateMap();log("Nouvelle réalité. Seed "+seed+".");log("Blackwater semble connaître votre nom.");if(Math.random()<.5)startQuest();render()
}
function generateMap(){
 map=Array.from({length:13},()=>Array(13).fill("wall"));let x=6,y=6;map[y][x]="floor";
 for(let i=0;i<200;i++){let d=R(4);x=Math.max(1,Math.min(11,x+(d===0?1:d===1?-1:0)));y=Math.max(1,Math.min(11,y+(d===2?1:d===3?-1:0)));map[y][x]="floor";if(rng()<.15){if(x<11)map[y][x+1]="floor";if(y<11)map[y+1][x]="floor"}}
 let floors=[];for(let yy=1;yy<12;yy++)for(let xx=1;xx<12;xx++)if(map[yy][xx]==="floor")floors.push([xx,yy]);
 [px,py]=floors.splice(R(floors.length),1)[0];
 const place=t=>{if(!floors.length)return;let q=floors.splice(R(floors.length),1)[0];map[q[1]][q[0]]=t};
 place("exit");place("chest");place("shrine");place("trap");place("npc");place("quest");for(let i=0;i<5;i++)place("water")
}
function glyph(t){return t==="exit"?"▼":t==="chest"?"▣":t==="shrine"?"✦":t==="trap"?"×":t==="npc"?"☺":t==="quest"?"!":""}
function render(){
 document.getElementById("sub").textContent=`PROTO 0.9.1 · BLACKWATER · SEED ${seed} · PROF. ${player.depth}`;
 document.getElementById("hud").innerHTML=`PV <span class=hp>${player.hp}/${player.maxhp}</span> · SAN <span class=san>${player.san}/${player.maxsan}</span> · MYTHE <span class=myth>${player.myth}%</span><br>ATQ ${player.atk} · DEF ${player.def} · Niv. ${player.lvl} · XP ${player.xp}/10<br>${player.char.name} · ${player.char.job}${player.quest&&!player.quest.done?`<br><span class=gold>QUÊTE : ${player.quest.title}</span>`:""}`;
 let m=document.getElementById("map");m.innerHTML="";
 for(let y=0;y<13;y++)for(let x=0;x<13;x++){let t=map[y][x],d=document.createElement("div");d.className="tile "+(t==="wall"?"wall":t==="water"?"water":"floor");if(x===px&&y===py){d.className+=" player";d.textContent="☉"}else if(enemy&&enemy.x===x&&enemy.y===y){d.className+=" enemy";d.textContent="☠"}else{d.textContent=glyph(t);if(d.textContent)d.className+=" feature";if(t==="npc")d.className+=" npc";if(t==="quest")d.className+=" quest"}m.appendChild(d)}
 renderContext()
}
function move(dx,dy){if(document.getElementById("context").dataset.mode==="dialogue")closeDialogue();if(battle)return;let nx=px+dx,ny=py+dy;if(nx<0||ny<0||nx>12||ny>12||map[ny][nx]==="wall")return;px=nx;py=ny;resolveTile();if(!battle&&rng()<.10)spawnEnemy();render()}
function resolveTile(){
 let t=map[py][px];
 if(t==="trap"){map[py][px]="floor";let d=3+R(5);player.hp-=d;log("Piège : -"+d+" PV.");if(player.hp<=0)death()}
 else if(t==="chest"){map[py][px]="floor";loot()}
 else if(t==="shrine"){map[py][px]="floor";player.myth+=4;player.san=Math.max(0,player.san-3);log("Autel impossible : +4% Mythe, -3 SAN.")}
 else if(t==="exit"){player.depth++;log("Vous descendez au niveau "+player.depth+".");generateMap()}
}

function skillCheck(skill,difficulty){
 const v=player.char.skills[skill]||0;
 const roll=Math.floor(Math.random()*100)+1;
 const success=roll<=Math.max(5,Math.min(95,v-difficulty));
 log(`${skill} : ${roll} / ${Math.max(5,v-difficulty)} ${success?"✓":"✗"}`);
 return success
}
function questTemplates(){
 return [
  {title:"La cloche sous la pierre",objective:"Trouver l'autel impossible",target:"shrine",skill:"Occultisme",reward:"Fragment noir",desc:"Un son de cloche vient de sous Blackwater. Personne d'autre ne semble l'entendre."},
  {title:"Le disparu du quai",objective:"Retrouver une trace près d'un cache",target:"chest",skill:"Investigation",reward:"Bandage militaire",desc:"Un docker a disparu après avoir parlé d'yeux dans l'eau."},
  {title:"Le carnet du professeur",objective:"Examiner le point marqué",target:"quest",skill:"Érudition",reward:"Sel consacré",desc:"Des notes mentionnent une géométrie qui n'existe qu'à marée basse."}
 ]
}
function startQuest(){
 const q=questTemplates()[R(questTemplates().length)];
 player.quest={...q,progress:0,done:false};
 log("Quête : "+q.title+" — "+q.objective+".");
 toast("Nouvelle quête : "+q.title)
}
function completeQuest(){
 if(!player.quest||player.quest.done)return;
 player.quest.done=true;player.xp+=5;player.reputation++;
 player.inv.push({n:player.quest.reward});seenItems[player.quest.reward]=true;
 log("Quête accomplie : "+player.quest.title+". Récompense : "+player.quest.reward+".");
 toast("Quête accomplie");
 if(player.xp>=10){player.xp-=10;player.lvl++;player.maxhp+=3;player.hp=player.maxhp;player.atk++}
}
function npcEncounter(){
 const c=player.char;
 const lines=[
   `Un vieil homme fixe ${c.name} sans cligner des yeux. « Vous avez déjà été ici. »`,
   `Une femme au manteau trempé demande : « Vous aussi, vous entendez la cloche ? »`,
   `Un policier pâle murmure : « N'allez pas plus bas. J'ai vu ce qui remonte. »`
 ];
 const text=lines[R(lines.length)];
 const html=`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
 <b>RENCONTRE</b><button onclick="closeDialogue()" style="min-height:32px;padding:4px 10px">✕</button></div>
 <br>${text}<div class="choiceGrid">
 <button onclick="npcChoice('questionner')">QUESTIONNER</button>
 <button onclick="npcChoice('rassurer')">RASSURER</button>
 <button onclick="npcChoice('menacer')">MENACER</button>
 <button onclick="npcChoice('partir')">PARTIR</button>
 </div>`;
 let cbox=document.getElementById("context");cbox.dataset.mode="dialogue";cbox.style.display="block";cbox.innerHTML=html
}
function closeDialogue(){
 let c=document.getElementById("context");
 c.style.display="none";
 c.innerHTML="";
 delete c.dataset.mode;
}
function npcChoice(choice){
 let skill=choice==="questionner"?"Investigation":choice==="rassurer"?"Psychologie":choice==="menacer"?"Armes":"";
 if(choice==="partir"){
   log("Vous mettez fin à la conversation.");
   closeDialogue();
   render();
   return
 }
 const ok=skillCheck(skill,15);
 if(ok){
   player.san=Math.min(player.maxsan,player.san+1);player.reputation++;
   log("La conversation vous apporte un indice utile.");
   if(!player.quest||player.quest.done)startQuest()
 }else{
   player.san=Math.max(0,player.san-2);player.reputation--;
   log("La conversation tourne mal. -2 SAN.")
 }
 closeDialogue();
 render()
}

function investigate(){
 if(battle)return;
 let t=map[py][px];
 if(t==="npc"){npcEncounter();return}
 if(t==="quest"){
   if(player.quest && !player.quest.done){
     const ok=skillCheck(player.quest.skill,10);
     if(ok)completeQuest(); else{player.san=Math.max(0,player.san-2);log("Vous ne parvenez pas à comprendre l'indice. -2 SAN.")}
   }else log("Cet endroit semble important, mais vous ignorez encore pourquoi.");
   render();return
 }
 if(["chest","shrine","trap","exit"].includes(t)){
   if(player.quest && !player.quest.done && player.quest.target===t){
     const ok=skillCheck(player.quest.skill,10);
     if(ok)completeQuest();
   }
   resolveTile();render();return
 }
 if(rng()<.38)spawnEnemy();
 else if(rng()<.42)loot();
 else{player.san=Math.max(0,player.san-1);log("Vous fouillez les lieux. Quelque chose vous observe. -1 SAN.");render()}
}
function loot(){
 const pool=["Bandage militaire","Sel consacré","Fragment noir","Symbole gravé"];let n=pool[R(pool.length)];player.inv.push({n});seenItems[n]=true;log("Objet trouvé : "+n+".");toast("Objet : "+n)
}
function spawnEnemy(){let names=Object.keys(creatures),name=names[R(names.length)],b=creatures[name];codex[name]=true;enemy={name,hp:b.hp+player.depth*2,maxhp:b.hp+player.depth*2,atk:b.atk+Math.floor(player.depth/2),x:px,y:py};battle=true;log("☠ "+name+" surgit.");render()}
function renderContext(){
 let c=document.getElementById("context");
 if(!battle){
   if(c.dataset.mode!=="dialogue") c.style.display="none";
   return
 }
 c.style.display="block";c.innerHTML=`<b>⚔ ${enemy.name}</b> · PV ${enemy.hp}/${enemy.maxhp}<div class=actions><button onclick=attack()>ATTAQUER</button><button onclick=defend()>DÉFENDRE</button><button onclick=combatItem()>OBJET</button><button onclick=flee()>FUIR</button></div>`
}
function attack(){let bonus=player.equip.arme==="Vieux revolver"?2:0,d=player.atk+bonus+R(4);enemy.hp-=d;log("Attaque : "+d+" dégâts.");if(enemy.hp<=0)win();else enemyTurn();render()}
function defend(){player.def+=3;enemyTurn();player.def-=3;render()}
function enemyTurn(){let d=Math.max(1,enemy.atk-player.def);player.hp-=d;if(rng()<.3)player.san=Math.max(0,player.san-1);log(enemy.name+" inflige "+d+" dégâts.");if(player.hp<=0)death()}
function combatItem(){
 let salt=player.inv.findIndex(i=>i.n==="Sel consacré"),band=player.inv.findIndex(i=>i.n==="Bandage militaire");
 if(salt>=0&&creatures[enemy.name].cat==="Mythe"){enemy.hp-=8;player.inv.splice(salt,1);log("Sel consacré : 8 dégâts.");if(enemy.hp<=0)win()}
 else if(band>=0){player.hp=Math.min(player.maxhp,player.hp+8);player.inv.splice(band,1);log("Bandage : +8 PV.");enemyTurn()}
 else toast("Aucun objet utile.");render()
}
function flee(){if(rng()<.65){battle=false;enemy=null;log("Vous fuyez.")}else enemyTurn();render()}
function win(){battle=false;enemy=null;player.xp+=5;player.myth+=2;log("Victoire.");if(player.xp>=10){player.xp-=10;player.lvl++;player.maxhp+=3;player.hp=player.maxhp;player.atk++;log("Niveau "+player.lvl+".")}render()}
function death(){battle=false;enemy=null;log("☠ Vous êtes mort.");toast("Vous êtes mort. Nouvelle réalité disponible.");render()}

document.getElementById("up").onclick=()=>move(0,-1);document.getElementById("down").onclick=()=>move(0,1);document.getElementById("left").onclick=()=>move(-1,0);document.getElementById("right").onclick=()=>move(1,0);document.getElementById("center").onclick=investigate;document.getElementById("actionBtn").onclick=investigate;
document.getElementById("menuBtn").onclick=()=>{closeDialogue();document.getElementById("mainMenu").classList.add("open")};

function modal(html){document.getElementById("sheetContent").innerHTML=html;document.getElementById("modal").classList.add("open")}
function openCharacter(){document.getElementById("mainMenu").classList.remove("open");let c=player.char;modal(`<h2>👤 ${c.name}</h2><p>${c.sex} · <b>${c.job}</b> · Trait : <b>${c.trait}</b></p><p>Total compétences : <b>400 points</b></p><div class=skills>${Object.entries(c.skills).map(([s,v])=>`<div class=skill><span>${s}</span><b>${v}</b><div class=bar><i style="width:${v}%"></i></div></div>`).join("")}</div>`)}
function openInventory(){document.getElementById("mainMenu").classList.remove("open");let names=[...new Set(player.inv.map(i=>i.n))];modal(`<h2>🎒 INVENTAIRE — ${player.inv.length}</h2><p>⚔ ${player.equip.arme||"—"} · 🔦 ${player.equip.outil||"—"} · ✦ ${player.equip.relique||"—"}</p>${names.map(n=>itemCard(n)).join("")}`)}
function itemCard(n){let db=itemDB[n]||{type:"Objet",rarity:"?",desc:"",tags:""},count=player.inv.filter(i=>i.n===n).length,eq=Object.values(player.equip).includes(n);return `<div class=entry><b>${n}${count>1?" ×"+count:""}</b> ${eq?"· ÉQUIPÉ":""}<br><span class=gold>${db.type} · ${db.rarity}</span><br>${db.desc}<br><span style="color:var(--muted)">Tags : ${db.tags}</span><div class=itemActions><button onclick="useInv('${n.replaceAll("'","\\'")}')">UTILISER</button>${db.slot?`<button onclick="equipInv('${n.replaceAll("'","\\'")}')">${eq?"DÉSÉQUIPER":"ÉQUIPER"}</button>`:""}<button onclick="dropInv('${n.replaceAll("'","\\'")}')">JETER</button></div></div>`}
function equipInv(n){let db=itemDB[n];if(!db?.slot)return;if(player.equip[db.slot]===n)player.equip[db.slot]=null;else player.equip[db.slot]=n;render();openInventory()}
function useInv(n){let i=player.inv.findIndex(x=>x.n===n);if(i<0)return;if(n==="Bandage militaire"){player.hp=Math.min(player.maxhp,player.hp+8);player.inv.splice(i,1);toast("+8 PV")}else if(n==="Lampe à pétrole"){let o=player.inv[i];o.uses=o.uses??2;if(o.uses>0){player.san=Math.min(player.maxsan,player.san+6);o.uses--;toast("+6 SAN");if(o.uses<=0){player.inv.splice(i,1);player.equip.outil=null}}}else if(n==="Fragment noir"){player.myth+=4;player.san=Math.max(0,player.san-3);toast("+4% Mythe · -3 SAN")}else if(n==="Symbole gravé"){player.myth+=1;toast("+1% Mythe")}else toast("Objet à équiper.");render();openInventory()}
function dropInv(n){let i=player.inv.findIndex(x=>x.n===n);if(i>=0)player.inv.splice(i,1);for(let k in player.equip)if(player.equip[k]===n)player.equip[k]=null;render();openInventory()}
function openBestiary(){document.getElementById("mainMenu").classList.remove("open");modal(`<h2>📖 BESTIAIRE</h2>${Object.keys(creatures).map(n=>`<div class=entry><b>${codex[n]?n:"???"}</b><br>${codex[n]?creatures[n].desc:"Créature non découverte."}</div>`).join("")}`)}
function openGuide(){document.getElementById("mainMenu").classList.remove("open");modal(`<h2>📚 GUIDE DES OBJETS</h2>${Object.keys(itemDB).map(n=>`<div class=entry><b>${seenItems[n]?n:"???"}</b><br>${seenItems[n]?itemDB[n].desc:"Objet non découvert."}</div>`).join("")}`)}
function openAchievements(){document.getElementById("mainMenu").classList.remove("open");modal(`<h2>🏆 SUCCÈS</h2><div class=entry>Première victoire ${player.xp>0||player.lvl>1?"✓":"?"}</div><div class=entry>Descendre sous Blackwater ${player.depth>0?"✓":"?"}</div></div>`)}

function openQuest(){
 document.getElementById("mainMenu").classList.remove("open");
 if(!player.quest){modal(`<h2>❗ QUÊTE</h2><p>Aucune quête active. Parlez aux habitants de Blackwater.</p>`);return}
 let q=player.quest;
 modal(`<h2>❗ ${q.title}</h2><div class="questBox"><b>${q.objective}</b><br>${q.desc}<br><br>Compétence clé : <b>${q.skill}</b><br>Récompense : <b>${q.reward}</b><br>État : <b>${q.done?"Terminée":"En cours"}</b></div>`)
}

function openJournal(){document.getElementById("mainMenu").classList.remove("open");modal(`<h2>📝 JOURNAL</h2>${journal.map(x=>`<div class=entry>${x}</div>`).join("")}`)}

newRun();
</script>
</body>
</html>
