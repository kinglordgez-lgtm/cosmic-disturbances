function currentQuestStep(){
 if(!player.quest||player.quest.done)return null;
 return player.quest.steps[player.quest.step||0]||null
}

function startQuest(){
 const q=questTemplates()[R(questTemplates().length)];
 player.quest={...q,step:0,done:false,history:[]};
 log("Quête : "+q.title+" — "+currentQuestStep().objective+".");toast("Nouvelle quête")
}

function changeQuest(reason){
 if(!player.quest){startQuest();return}
 if(typeof cd17Branch==="function"&&cd17Branch(reason))return;
 const q=player.quest,old=currentQuestStep();q.history.push("Échec : "+old.objective+" — "+reason);
 if(q.step<q.steps.length-1){q.step++;log("La piste bifurque : "+reason+". Nouvel objectif : "+currentQuestStep().objective+".");toast("La piste a changé")}
 else{const alt=questTemplates().filter(x=>x.title!==q.title),nq=alt[R(alt.length)];player.quest={...nq,step:0,done:false,history:[`La piste « ${q.title} » s'est refermée.`]};log("Une autre piste s'ouvre : "+player.quest.title+" — "+currentQuestStep().objective+".");toast("Nouvelle piste")}
}

function advanceQuest(){
 if(!player.quest||player.quest.done)return;

 if(q.step<q.steps.length-1){q.step++;log("Objectif accompli. Nouvelle étape : "+currentQuestStep().objective+".");toast("Quête mise à jour")}
 else completeQuest()
}

function generateMap(){

 let floors=[];for(let yy=1;yy<12;yy++)for(let xx=1;xx<12;xx++)if(map[yy][xx]==="floor")floors.push([xx,yy]);

}

 let bonus=player.equip.arme==="Vieux revolver"?2:0,notes=[];
 const ammo=player.inv.findIndex(i=>i.n==="Cartouches d'argent");
 if(ammo>=0){bonus+=3;player.inv.splice(ammo,1);notes.push("argent")}

 if(player.equip.relique==="Symbole gravé"&&weak==="symbole"){bonus+=5;notes.push("symbole")}
 if(player.equip.outil==="Lampe à pétrole"&&(weak==="lumière"||weak==="feu")){bonus+=4;notes.push("lumière")}

 enemy.hp-=d;log("Attaque : "+d+" dégâts"+(notes.length?" ["+notes.join("+")+"]":"")+".");

}

function bootGame(){
 try{
   if(typeof makeCharacter!=="function")throw new Error("Fonction critique manquante : makeCharacter");
   if(typeof newRun!=="function")throw new Error("Fonction critique manquante : newRun");
   if(typeof generateMap!=="function")throw new Error("Fonction critique manquante : generateMap");
   if(typeof move!=="function")throw new Error("Fonction critique manquante : move");
   if(typeof render!=="function")throw new Error("Fonction critique manquante : render");
   if(typeof resolveTile!=="function")throw new Error("Fonction critique manquante : resolveTile");
   if(typeof investigate!=="function")throw new Error("Fonction critique manquante : investigate");
   if(typeof skillCheck!=="function")throw new Error("Fonction critique manquante : skillCheck");
   if(typeof currentQuestStep!=="function")throw new Error("Fonction critique manquante : currentQuestStep");
   if(!player||!Array.isArray(map))newRun(); else render();
 }catch(e){console.error(e);showRuntimeError(e)}
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",bootGame,{once:true});
else bootGame();

function showRuntimeError(err){
 const p=document.getElementById("runtimeError");
 document.getElementById("runtimeErrorText").textContent=String(err&&err.message?err.message:err);
 p.style.display="block";
}
function recoverGame(){
 document.getElementById("runtimeError").style.display="none";
 try{
   battle=false;
   enemy=null;
   render();
 }catch(e){
   console.error(e);
   showRuntimeError(e);
 }
}
window.addEventListener("error",e=>{
 console.error(e.error||e.message);
 showRuntimeError(e.error||e.message);
});
window.addEventListener("unhandledrejection",e=>{
 console.error(e.reason);
 showRuntimeError(e.reason);
});


function validateCore(){
 const required=["move","resolveTile","loot","spawnEnemy","render","investigate","attack","flee","renderContext"];
 const missing=required.filter(n=>typeof window[n]!=="function");
 if(missing.length){
   showRuntimeError("Fonction(s) manquante(s) : "+missing.join(", "));
   return false;
 }
 return true;
}
window.addEventListener("load",()=>{validateCore();bootGame()});


setInterval(()=>{
 if(battle){
   const c=document.getElementById("context");
   if(!c || c.style.display==="none" || !c.innerHTML.trim()) renderContext();
 }
},1000);
</script>

<script id="geometry-0140">
function cd14Inside(x,y){return x>0&&y>0&&x<12&&y<12}
function cd14Floor(x,y){if(cd14Inside(x,y))map[y][x]="floor"}
function cd14Wall(x,y){if(cd14Inside(x,y))map[y][x]="wall"}
function cd14Room(x0,y0,x1,y1){
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)cd14Floor(x,y)
}
function cd14Corridor(x0,y0,x1,y1){
 let x=x0,y=y0;cd14Floor(x,y);
 while(x!==x1){x+=x<x1?1:-1;cd14Floor(x,y)}
 while(y!==y1){y+=y<y1?1:-1;cd14Floor(x,y)}
}
function cd14FindFloor(){
 const a=[];for(let y=1;y<12;y++)for(let x=1;x<12;x++)if(map[y][x]==="floor")a.push([x,y]);
 return a
}
function cd14PlaceSpecials(){
 let a=cd14FindFloor().filter(([x,y])=>!(x===px&&y===py));
 const take=(type,n)=>{for(let k=0;k<n&&a.length;k++){let i=R(a.length),p=a.splice(i,1)[0];map[p[1]][p[0]]=type}};
 take("exit",1);take("npc",2);take("quest",2);take("chest",2);take("shrine",1);take("trap",2);

 if(!window.map||!Array.isArray(map)||map.length<13)return;

 }else if(z.includes("Galeries")){

/* === V0.29.0 : anti-softlock + dialogues réellement contextuels === */
function cd29Walkable(x,y){
 return y>=0&&y<map.length&&x>=0&&map[y]&&x<map[y].length&&map[y][x]!=="wall";
}
function cd29ReachableFrom(sx,sy){
 const seen=new Set([sx+","+sy]), q=[[sx,sy]];
 while(q.length){
  const [x,y]=q.shift();
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const nx=x+dx,ny=y+dy,k=nx+","+ny;
   if(!seen.has(k)&&cd29Walkable(nx,ny)){seen.add(k);q.push([nx,ny])}
  }
 }
 return seen;
}
function cd29EnsureCriticalAccess(){
 if(!map||!map.length)return;
 const seen=cd29ReachableFrom(px,py);
 let exit=null;
 for(let y=0;y<map.length;y++)for(let x=0;x<map[y].length;x++){
   if(map[y][x]==="exit")exit={x,y};
 }
 if(exit&&!seen.has(exit.x+","+exit.y)){
   // Put the exit on a reachable floor tile far from the player.
   let cand=[];
   for(const k of seen){
     const [x,y]=k.split(",").map(Number);
     if(map[y][x]==="floor" && Math.abs(x-px)+Math.abs(y-py)>=5)cand.push({x,y});
   }
   if(!cand.length)for(const k of seen){
     const [x,y]=k.split(",").map(Number);
     if(map[y][x]==="floor")cand.push({x,y});
   }
   if(cand.length){
     map[exit.y][exit.x]="floor";
     const c=cand[R(cand.length)]; map[c.y][c.x]="exit";
     log("GÉNÉRATION — Une issue inaccessible a été repositionnée.");
   }
 }
 // Critical active quest target must also have at least one reachable instance.
 if(player&&player.quest&&!player.quest.done&&typeof currentQuestStep==="function"){
   const st=currentQuestStep(), icon=st&&st.icon;
   if(icon){
     let ok=false;
     for(const k of seen){const [x,y]=k.split(",").map(Number); if(map[y][x]===icon){ok=true;break}}
     if(!ok){
       const floors=[...seen].map(k=>k.split(",").map(Number)).filter(([x,y])=>map[y][x]==="floor"&&Math.abs(x-px)+Math.abs(y-py)>2);
       if(floors.length){const [x,y]=floors[R(floors.length)];map[y][x]=icon;log("GÉNÉRATION — L'objectif de quête a été rendu accessible.");}
     }
   }
 }
}
const cd29OldGenerate=(typeof genMap==="function"?genMap:null);
if(cd29OldGenerate){
 genMap=function(){const r=cd29OldGenerate.apply(this,arguments);cd29EnsureCriticalAccess();return r}
}
const cd29OldRender=(typeof render==="function"?render:null);
let cd29Guard=false;
if(cd29OldRender){
 render=function(){
  if(!cd29Guard){cd29Guard=true;try{cd29EnsureCriticalAccess()}catch(e){console.warn("cd29 access",e)}cd29Guard=false}
  return cd29OldRender.apply(this,arguments)
 }
}
