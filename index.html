<script id="mobile-modal-hotfix-js-061">
document.addEventListener('DOMContentLoaded',()=>{
  const labels=['INVENTAIRE','BESTIAIRE','GUIDE OBJETS','SUCCÈS'];
  function visibleDialogs(){
    return [...document.querySelectorAll('body *')].filter(el=>{
      const t=(el.innerText||'').trim();
      if(!labels.some(x=>t.startsWith(x))) return false;
      const s=getComputedStyle(el);
      return s.display!=='none' && s.visibility!=='hidden' && el.offsetHeight>180;
    }).sort((a,b)=>a.innerText.length-b.innerText.length);
  }
  function close(el){
    const candidates=[...el.querySelectorAll('button')];
    let b=candidates.find(x=>/FERMER|RETOUR|×|✕|X/i.test((x.textContent||'').trim()));
    if(b){b.click();return}
    // fallback: hide closest large overlay/modal without affecting game state
    let p=el;
    for(let i=0;i<5 && p;i++,p=p.parentElement){
      if(p.offsetHeight>innerHeight*.55 && p.offsetWidth>innerWidth*.75){p.style.display='none';break}
    }
    document.body.classList.remove('cd-modal-open');
  }
  function fix(){
    const d=visibleDialogs()[0];
    if(!d) return;
    document.body.classList.add('cd-modal-open');
    d.style.maxHeight='88dvh'; d.style.overflowY='auto';
    if(!d.querySelector('.cd-close-061')){
      const x=document.createElement('button');
      x.className='cd-close-061'; x.textContent='✕'; x.setAttribute('aria-label','Fermer');
      x.onclick=e=>{e.stopPropagation();close(d)};
      d.prepend(x);
    }
  }
  new MutationObserver(()=>setTimeout(fix,0)).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class']});
  document.addEventListener('click',()=>setTimeout(fix,0),true);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){const d=visibleDialogs()[0];if(d)close(d)}});
  setTimeout(fix,300);
});
</script>

<script id="orientation-062">
(function(){
  function refreshOrientation(){
    document.documentElement.dataset.orientation =
      innerWidth>innerHeight ? "landscape" : "portrait";
    // Re-render only if the game has initialized; state is preserved.
    try{
      if(typeof render==="function" && typeof p!=="undefined" && p){render();}
    }catch(e){}
  }
  addEventListener("orientationchange",()=>setTimeout(refreshOrientation,120));
  addEventListener("resize",()=>setTimeout(refreshOrientation,80));
  addEventListener("DOMContentLoaded",refreshOrientation);
})();
</script>

function R(n){return Math.floor(rng()*n)}
function saveMeta(){localStorage.setItem("cd_codex_v04",JSON.stringify(codex));localStorage.setItem("cd_items_v04",JSON.stringify(itemsSeen));localStorage.setItem("cd_ach_v04",JSON.stringify(achievements))}
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",1800)}
function log(s){const x=document.getElementById("log");x.textContent=s+"\n"+x.textContent}
function seeItem(name){if(!itemsSeen[name]){itemsSeen[name]=1;saveMeta();toast("🎒 Objet découvert : "+name)}}
function discover(name){if(!codex[name]){codex[name]=1;saveMeta();toast("📖 Bestiaire : "+name);if(Object.keys(codex).length>=3)unlock("Premier catalogue")}}
function unlock(name){if(!achievements[name]){achievements[name]=Date.now();saveMeta();toast("🏆 Succès : "+name)}}
function newGame(){
 seed=100000+Math.floor(Math.random()*899999);rng=mulberry32(seed);
 p={hp:34,maxhp:34,san:34,maxsan:34,myth:0,atk:5,def:1,lvl:1,xp:0,turn:0,depth:0,kills:0,
 equip:{arme:"Vieux revolver",outil:"Lampe à pétrole",relique:null},
 inv:[{n:"Lampe à pétrole",tag:"feu",uses:2},{n:"Vieux revolver",tag:"bruit",atk:2}]};
 p.inv.forEach(i=>seeItem(i.n));battle=false;enemy=null;eventOpen=false;generateMap();
 document.getElementById("log").textContent="";
 log("Nouvelle réalité. Seed "+seed+".");log("Blackwater semble connaître votre nom.");render()
}
function carve(x,y){if(x>0&&x<12&&y>0&&y<12)map[y][x]="floor"}
function generateMap(){
 map=Array.from({length:13},()=>Array(13).fill("wall"));
 let x=6,y=6;carve(x,y);
 for(let i=0;i<180;i++){const d=R(4);x=Math.max(1,Math.min(11,x+(d===0?1:d===1?-1:0)));y=Math.max(1,Math.min(11,y+(d===2?1:d===3?-1:0)));carve(x,y);if(rng()<.18){carve(x+1,y);carve(x-1,y);carve(x,y+1);carve(x,y-1)}}
 const floors=[];for(let yy=1;yy<12;yy++)for(let xx=1;xx<12;xx++)if(map[yy][xx]==="floor")floors.push([xx,yy]);
 const take=()=>floors.splice(R(floors.length),1)[0];
 [px,py]=take(); const exit=take(), chest=take(), shrine=take(), trap=take();
 map[exit[1]][exit[0]]="exit";map[chest[1]][chest[0]]="chest";map[shrine[1]][shrine[0]]="shrine";map[trap[1]][trap[0]]="trap";
 for(let i=0;i<Math.min(5,floors.length);i++){const q=take();map[q[1]][q[0]]="water"}
}
function tileGlyph(t){return t==="exit"?"▼":t==="chest"?"▣":t==="shrine"?"✦":t==="trap"?"×":""}
function render(){
 document.getElementById("seed").textContent=seed;document.getElementById("depth").textContent=p.depth;
 const m=document.getElementById("map");m.innerHTML="";
 for(let y=0;y<13;y++)for(let x=0;x<13;x++){const d=document.createElement("div"),t=map[y][x];d.className="tile "+(t==="wall"?"wall":t==="water"?"water":"floor");
 if(x===px&&y===py){d.className+=" player";d.textContent="☉"}else if(enemy&&x===enemy.x&&y===enemy.y){d.className+=" foe";d.textContent="☠"}else d.textContent=tileGlyph(t);m.appendChild(d)}
 const syn=activeSynergies();
 document.getElementById("stats").innerHTML=`PV <span class="hp">${p.hp}/${p.maxhp}</span> · SAN <span class="san">${p.san}/${p.maxsan}</span> · MYTHE <span class="myth">${p.myth}%</span><br>ATQ ${p.atk} · DEF ${p.def} · Niv. ${p.lvl} · XP ${p.xp}/10 · Prof. ${p.depth}<br>🎒 ${p.inv.map(i=>i.n).join(" · ")}${syn.length?`<br><span class="gold">SYNERGIE : ${syn.join(" · ")}</span>`:""}`;
 document.getElementById("battle").style.display=battle?"block":"none";document.getElementById("eventPanel").style.display=eventOpen?"block":"none";if(battle)updateBattle()
}
function move(dx,dy){
 if(battle||eventOpen)return;const nx=px+dx,ny=py+dy;if(nx<1||nx>11||ny<1||ny>11||map[ny][nx]==="wall")return;
 px=nx;py=ny;p.turn++;resolveTile();if(!battle&&!eventOpen&&rng()<0.10)spawnEnemy();sanityPressure();render()
}
function waitTurn(){if(!battle&&!eventOpen){p.turn++;if(rng()<.16)spawnEnemy();sanityPressure();render()}}
function sanityPressure(){if(p.san<=0){p.hp-=3;p.myth+=3;log("Votre esprit cède. Une voix répond depuis le mur.")}if(p.hp<=0)die()}
function resolveTile(){
 const t=map[py][px];
 if(t==="trap"){map[py][px]="floor";const d=3+R(5);p.hp-=d;log("Piège : "+d+" PV perdus.");}
 else if(t==="chest"){map[py][px]="floor";lootChest()}
 else if(t==="shrine"){map[py][px]="floor";openEvent("AUTEL IMPOSSIBLE","Les angles de la pierre changent lorsque vous clignez des yeux.","toucher","ignorer")}
 else if(t==="exit"){openEvent("ESCALIER VERS LE BAS","Une haleine froide remonte des profondeurs.","descendre","rester")}
}
function lootChest(){
 const pool=[{n:"Bandage militaire",tag:"soin"},{n:"Sel consacré",tag:"rituel"},{n:"Œil humide",tag:"profond"},{n:"Symbole gravé",tag:"occulte"},{n:"Fragment noir",tag:"cosmique"}];
 const loot=pool[R(pool.length)];p.inv.push(loot);seeItem(loot.n);log("Cache découverte : "+loot.n+".")
}
function activeSynergies(){
 const a=[];const names=p.inv.map(i=>i.n);
 if(names.includes("Fragment noir")&&names.includes("Symbole gravé"))a.push("Résonance interdite");
 if(p.equip&&p.equip.relique==="Œil humide")a.push("Vision des profondeurs");
 return a
}
function spawnEnemy(){
 const n=R(100),depth=p.depth;
 const name=n<38?"Cultiste":n<65?"Profond":n<82?"Goule":n<93?"Mi-Go":n<98?"Byakhee":"Shoggoth";
 const stats={"Cultiste":[13,4],"Profond":[20,6],"Goule":[17,7],"Mi-Go":[23,7],"Byakhee":[28,8],"Shoggoth":[45,10]},s=stats[name],scale=Math.floor(depth/2);
 discover(name);enemy={name,hp:s[0]+depth*2,maxhp:s[0]+depth*2,atk:s[1]+scale,x:px,y:py,status:"",turn:0};battle=true;
 if(activeSynergies().includes("Résonance interdite")){p.san=Math.max(0,p.san-1);log("La Résonance interdite exige son prix. -1 SAN.")}
 log("☠ "+name+" surgit dans la brume.")
}
function updateBattle(){document.getElementById("battleTitle").textContent="⚔ "+enemy.name;document.getElementById("battleInfo").innerHTML=`PV ennemi <span class="hp">${enemy.hp}/${enemy.maxhp}</span> · ATQ ${enemy.atk} · Vous ${p.hp} PV · ${p.san} SAN${enemy.status?` · <span class="gold">${enemy.status}</span>`:""}`}
function enemyTurn(){
 if(!battle)return;
 if(enemy.status==="aveuglé"){log(enemy.name+" hésite dans la lumière.");enemy.status="";return}
 const d=Math.max(1,enemy.atk-p.def+(rng()<0.18?2:0));p.hp-=d;
 const sanLoss=(enemy.name==="Shoggoth"?3:enemy.name==="Mi-Go"?2:1);if(rng()<0.38)p.san=Math.max(0,p.san-sanLoss);
 log(enemy.name+" inflige "+d+" dégâts.");if(p.hp<=0)die()
}
function attack(){
 if(!battle)return;let bonus=(p.equip&&p.equip.arme==="Vieux revolver")?2:0;
 if(enemy.name==="Cultiste"&&p.equip.arme==="Vieux revolver")bonus+=2;
 if(enemy.name==="Profond"&&p.equip.relique==="Œil humide")bonus+=3;
 if(activeSynergies().includes("Résonance interdite"))bonus+=3;
 const crit=rng()<.12,d=p.atk+bonus+R(4)+(crit?4:0);enemy.hp-=d;log((crit?"COUP CRITIQUE. ":"")+"Attaque : "+d+" dégâts.");
 if(enemy.hp<=0)victory();else enemyTurn();render()
}
function defend(){if(!battle)return;p.def+=3;log("Vous vous mettez en garde. +3 DEF pour ce tour.");enemyTurn();p.def-=3;render()}
function useItem(){
 if(!battle)return;
 const lamp=p.inv.find(i=>i.n==="Lampe à pétrole"&&(i.uses||0)>0);
 const salt=p.inv.find(i=>i.n==="Sel consacré");
 const band=p.inv.find(i=>i.n==="Bandage militaire");
 if(p.san<12&&lamp){p.san=Math.min(p.maxsan,p.san+6);lamp.uses--;if(enemy.name==="Goule")enemy.status="aveuglé";log("La lampe repousse les ombres. +6 SAN.");if(lamp.uses<=0){p.inv.splice(p.inv.indexOf(lamp),1);if(p.equip.outil==="Lampe à pétrole")p.equip.outil=null}}
 else if(enemy.name!=="Cultiste"&&salt){enemy.hp-=8;p.inv.splice(p.inv.indexOf(salt),1);log("Le sel consacré brûle la créature. 8 dégâts.");if(enemy.hp<=0){victory();render();return}}
 else if(band){p.hp=Math.min(p.maxhp,p.hp+8);p.inv.splice(p.inv.indexOf(band),1);log("Bandage : +8 PV.")}
 else{toast("Aucun objet de combat utile.");return}
 enemyTurn();render()
}
function flee(){if(!battle)return;const chance=Math.max(.25,.70-p.depth*.04);if(rng()<chance){battle=false;log("Vous fuyez dans la brume.")}else{log("La fuite échoue.");enemyTurn()}render()}
function victory(){
 battle=false;p.xp+=5;p.myth+=2;p.kills++;
 const pool=[{n:"Œil humide",tag:"profond"},{n:"Symbole gravé",tag:"occulte"},{n:"Bandage militaire",tag:"soin"},{n:"Sel consacré",tag:"rituel"}];
 if(rng()<.75){const loot=pool[R(pool.length)];p.inv.push(loot);seeItem(loot.n);log("Victoire. Butin : "+loot.n+".")}else log("Victoire. Aucun butin.");
 unlock("Première victoire");if(p.kills>=5)unlock("Chasseur de l'indicible");
 if(p.xp>=10){p.xp-=10;p.lvl++;p.maxhp+=3;p.hp=Math.min(p.maxhp,p.hp+8);p.atk++;log("⬆ Niveau "+p.lvl+".");unlock("Le prix du savoir")}
}
function randomEvent(){const r=rng();if(r<.30){p.san=Math.max(0,p.san-2);p.myth+=2;log("Une silhouette traverse la brume. -2 SAN.")}else if(r<.55){lootChest()}else openEvent("MURMURE DANS LA PIERRE","Une voix prononce un souvenir que vous n'avez jamais vécu.","écouter","fuir")}
function openEvent(t,txt,a,b){eventOpen=true;document.getElementById("eventText").innerHTML=`<b>${t}</b><br>${txt}`;const c=document.getElementById("eventChoices");c.innerHTML="";[a,b].forEach(v=>{const q=document.createElement("button");q.textContent=v.toUpperCase();q.onclick=()=>choice(v);c.appendChild(q)});render()}
function choice(v){
 eventOpen=false;
 if(v==="descendre"){p.depth++;unlock(p.depth>=3?"Sous Blackwater":"Première descente");log("Vous descendez au niveau "+p.depth+".");generateMap()}
 else if(v==="rester"){log("Vous restez à cet étage.")}
 else if(v==="toucher"||v==="écouter"){p.myth+=5;p.san=Math.max(0,p.san-4);log("La réalité se plie. +5% Mythe, -4 SAN.");if(rng()<.35){p.inv.push({n:"Clé d'obsidienne",tag:"clé"});seeItem("Clé d'obsidienne");log("Une Clé d'obsidienne apparaît dans votre paume.")}}
 else{p.san=Math.max(0,p.san-1);log("Vous refusez. Quelque chose frappe trois fois.")}
 render()
}
function interact(){if(battle||eventOpen)return;const t=map[py][px];if(["exit","chest","shrine","trap"].includes(t)){resolveTile();render();return}log("Vous enquêtez. Odeur de sel, métal et chair.");if(rng()<.28)randomEvent();else if(rng()<.30)spawnEnemy();render()}
function die(){battle=false;eventOpen=false;log("☠ VOUS ÊTES MORT. Une nouvelle réalité vous attend.");unlock("Mourir à Blackwater");render()}
function openModal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").style.display="flex"}
function closeModal(){document.getElementById("modal").style.display="none"}

function itemInfo(name){return itemDB.find(i=>i.name===name)||{name:name,type:"Inconnu",rarity:"?",slot:null,tags:[],effect:"Effet inconnu.",synergy:"Aucune synergie connue."};}
function itemCount(name){return p.inv.filter(i=>i.n===name).length;}
function equippedSlot(name){if(!p.equip)p.equip={arme:null,outil:null,relique:null};return Object.keys(p.equip).find(k=>p.equip[k]===name)||null;}
function openInventory(){
 if(!p.equip)p.equip={arme:null,outil:null,relique:null};
 const names=[...new Set(p.inv.map(i=>i.n))];
 let s=`<h2>🎒 INVENTAIRE — ${p.inv.length} objet${p.inv.length>1?"s":""}</h2>`;
 s+=`<div class="entry"><b>ÉQUIPEMENT</b><br>⚔ Arme : ${p.equip.arme||"—"}<br>🔦 Outil : ${p.equip.outil||"—"}<br>✦ Relique : ${p.equip.relique||"—"}</div>`;
 if(!names.length)s+=`<div class="entry">Votre sac est vide.</div>`;
 names.forEach(name=>{
  const i=itemInfo(name),eq=equippedSlot(name),count=itemCount(name),safe=name.replace(/'/g,"\\'");
  s+=`<div class="entry"><b>${i.name}${count>1?" ×"+count:""}</b> ${eq?`<span class="badge">ÉQUIPÉ · ${eq}</span>`:""}<br><span class="gold">${i.type} · ${i.rarity}</span><br>${i.effect}<br><span class="hint">Tags : ${i.tags.join(", ")||"—"}</span><br><b>Synergie :</b> ${i.synergy}<br><button onclick="inventoryAction('examine','${safe}')">EXAMINER</button> ${i.slot?`<button onclick="inventoryAction('equip','${safe}')">${eq?"DÉSÉQUIPER":"ÉQUIPER"}</button>`:""} <button onclick="inventoryAction('use','${safe}')">UTILISER</button> <button onclick="inventoryAction('drop','${safe}')">JETER</button></div>`;
 });
 openModal(s);
}
function inventoryAction(action,name){
 const info=itemInfo(name),idx=p.inv.findIndex(i=>i.n===name);
 if(idx<0){toast("Objet absent.");openInventory();return;}
 if(action==="examine"){
  seeItem(name);
  let consequence="";
  if(info.tags.includes("maudit")){
    p.san=Math.max(0,p.san-2);p.myth+=2;
    consequence="<br><br><b>Conséquence :</b> -2 SAN · +2% Mythe";
    log("Vous examinez "+name+". Quelque chose vous examine en retour. -2 SAN, +2% Mythe.");
  } else {
    log("Vous examinez "+name+" : "+info.effect);
  }
  render();
  openModal(`<h2>🔎 ${info.name}</h2>
    <div class="entry"><span class="gold">${info.type} · ${info.rarity}</span><br><br>
    <b>Effet :</b> ${info.effect}<br><br>
    <b>Tags :</b> ${info.tags.join(", ")||"—"}<br><br>
    <b>Synergie connue :</b> ${info.synergy}${consequence}</div>
    <button onclick="openInventory()">← RETOUR À L'INVENTAIRE</button>`);
  return;
 } else if(action==="equip"){
  if(!info.slot){toast("Cet objet ne s'équipe pas.");return;}
  if(p.equip[info.slot]===name){p.equip[info.slot]=null;log(name+" déséquipé.");toast("Déséquipé : "+name);}
  else{p.equip[info.slot]=name;log(name+" équipé : "+info.slot+".");toast("Équipé : "+name);}
 } else if(action==="use"){
  if(name==="Lampe à pétrole"){const o=p.inv[idx];if((o.uses||0)<=0){toast("La lampe est vide.");return;}p.san=Math.min(p.maxsan,p.san+6);o.uses--;log("Lampe : +6 SAN. Charges : "+o.uses+".");if(o.uses<=0){p.inv.splice(idx,1);if(p.equip.outil===name)p.equip.outil=null;}}
  else if(name==="Œil humide"){p.san=Math.min(p.maxsan,p.san+3);p.inv.splice(idx,1);if(p.equip.relique===name)p.equip.relique=null;log("L'Œil humide se dissout. +3 SAN.");}
  else if(name==="Fragment noir"){p.myth+=4;p.san=Math.max(0,p.san-3);log("Le Fragment pulse. +4% Mythe, -3 SAN.");}
  else if(name==="Symbole gravé"){p.myth+=1;log("Le symbole réagit. +1% Mythe.");}
  else if(name==="Bandage militaire"){p.hp=Math.min(p.maxhp,p.hp+8);p.inv.splice(idx,1);log("Bandage : +8 PV.");}
  else if(name==="Sel consacré"){toast("Gardez-le pour un combat contre le Mythe.");return;}
  else if(name==="Clé d'obsidienne"){toast("La clé attend une serrure qui n'existe pas encore.");return;}
  else toast("Équipez cet objet pour profiter de son effet.");
 } else if(action==="drop"){
  p.inv.splice(idx,1);const slot=equippedSlot(name);if(slot)p.equip[slot]=null;log("Vous abandonnez "+name+".");
 }
 render();openInventory();
}

function openCodex(){let s=`<h2>📖 BESTIAIRE — ${Object.keys(codex).length}/${bestiary.length}</h2>`;bestiary.forEach(e=>{const known=!!codex[e.name];s+=`<div class="entry ${known?"":"locked"}"><b>${known?e.name:"ENTRÉE INCONNUE"}</b><br>${known?e.desc:"Vous n'avez pas encore observé cette entité."}${known?`<br><span class="gold">${e.cat}</span> · ${e.traits}`:""}</div>`});openModal(s)}
function openItems(){let s=`<h2>🎒 GUIDE DES OBJETS — ${Object.keys(itemsSeen).length}/${itemDB.length}</h2>`;itemDB.forEach(i=>{const known=!!itemsSeen[i.name];s+=`<div class="entry ${known?"":"locked"}"><b>${known?i.name:"OBJET INCONNU"}</b>${known?`<br><span class="gold">${i.type} · ${i.rarity}</span><br>${i.effect}<br><span class="hint">Tags : ${i.tags.join(", ")}</span><br><b>Synergie :</b> ${i.synergy}`:"<br>Découvrez cet objet en exploration ou en combat."}</div>`});openModal(s)}
function openAchievements(){const list=["Première victoire","Premier catalogue","Le prix du savoir","Première descente","Sous Blackwater","Chasseur de l'indicible","Mourir à Blackwater"];let s="<h2>🏆 SUCCÈS</h2>";list.forEach(x=>s+=`<div class="entry ${achievements[x]?"":"locked"}"><b>${achievements[x]?"✓":"?"} ${x}</b><br><span class="hint">${achievements[x]?"Débloqué":"Succès à découvrir"}</span></div>`);openModal(s)}
window.addEventListener("error",e=>{document.getElementById("stats").textContent="Erreur JS : "+e.message});
newGame();
</script>

 overflow:auto;color:var(--ink)
}

<script id="rpg-mobile-js-080">
(function(){
 const $=id=>document.getElementById(id);
 const clickOld=id=>{const e=$(id);if(e)e.click()};
 const menu=$("rpgMenu080");
 $("menu080").onclick=()=>{menu.classList.add("open");drawChar()};
 $("closeMenu080").onclick=()=>menu.classList.remove("open");
 menu.querySelectorAll("[data-old]").forEach(b=>b.onclick=()=>{menu.classList.remove("open");clickOld(b.dataset.old)});
 $("newRun080").onclick=()=>{menu.classList.remove("open"); const bs=[...document.querySelectorAll("button")].find(x=>/NOUVELLE RÉALITÉ/i.test(x.textContent)&&x.id!=="newRun080"); if(bs)bs.click()};

 function findControl(rx){
   return [...document.querySelectorAll("#app button")].find(b=>rx.test((b.textContent||"").trim()));
 }
 function fire(rx){const b=findControl(rx);if(b)b.click()}
 $("jU").onclick=()=>fire(/^▲$/); $("jD").onclick=()=>fire(/^▼$/);
 $("jL").onclick=()=>fire(/^◀$/); $("jR").onclick=()=>fire(/^▶$/);
 $("jC").onclick=()=>fire(/ENQUÊTER/i); $("act080").onclick=()=>fire(/ENQUÊTER/i);
 const first=["Elias","Walter","Edwin","Arthur","Samuel","Thomas","Henry","Clara","Evelyn","Mabel","Helen","Edith","Margaret","Alice"];
 const last=["Ward","Blackwood","Marsh","Gilman","Derby","Carter","Whateley","Armitage","Danforth","Pickman","Waite","Talbot"];
 const jobs=[
  ["Détective","Investigation","Armes"],
  ["Médecin","Médecine","Psychologie"],
  ["Professeur","Érudition","Occultisme"],
  ["Journaliste","Investigation","Psychologie"],
  ["Marin","Endurance","Armes"],
  ["Antiquaire","Occultisme","Érudition"],
  ["Photographe","Observation","Investigation"],
  ["Infirmière","Médecine","Observation"]
 ];
 const traits=["Sang-froid","Curieux","Méfiant","Insomniaque","Œil exercé","Volonté de fer","Superstitieux","Cicatrice étrange"];
 const skillNames=["Investigation","Observation","Armes","Médecine","Psychologie","Occultisme","Érudition","Endurance"];
 function hashSeed(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
 function rng(seed){let x=seed||1;return()=>((x=Math.imul(1664525,x)+1013904223>>>0)/4294967296)}
 function getSeed(){let m=(document.body.innerText.match(/SEED\s+(\d+)/i)||[])[1];return m||Date.now()}
 function character(){
   const r=rng(hashSeed(getSeed()));
   const female=r()<.5, names=female?first.slice(7):first.slice(0,7);
   const job=jobs[Math.floor(r()*jobs.length)];
   // Equal total: 400 every run. Archetype biases redistribution, never total.
   let vals=skillNames.map(()=>35);
   const pref=[skillNames.indexOf(job[1]),skillNames.indexOf(job[2])];
   vals[pref[0]]+=35; vals[pref[1]]+=25;
   let remaining=400-vals.reduce((a,b)=>a+b,0);
   while(remaining>0){let i=Math.floor(r()*vals.length);vals[i]++;remaining--}
   return {name:names[Math.floor(r()*names.length)]+" "+last[Math.floor(r()*last.length)],
     sex:female?"Femme":"Homme",job:job[0],trait:traits[Math.floor(r()*traits.length)],vals};
 }
 function drawChar(){
   const c=character();
   $("char080").innerHTML="<h3>👤 FEUILLE DE PERSONNAGE</h3>"+
    "<p><b>"+c.name+"</b> · "+c.sex+" · <b>"+c.job+"</b> · Trait : <b>"+c.trait+"</b></p>"+
    "<p style='color:#959cab'>Total des compétences : <b>400 points</b> — identique pour tous les investigateurs.</p>"+
    "<div class='skills'>"+skillNames.map((s,i)=>"<div class='skillrow'><span>"+s+"</span><b>"+c.vals[i]+"</b><div class='skillbar'><i style='width:"+Math.min(100,c.vals[i])+"%'></i></div></div>").join("")+"</div>";
 }
 $("charBtn080").onclick=drawChar;
})();
</script>


<script id="systems-082">
(function(){
 const firstM=["Elias","Walter","Edwin","Arthur","Samuel","Thomas","Henry","Nathaniel","Silas","George","Howard","Francis"];
 const firstF=["Clara","Evelyn","Mabel","Helen","Edith","Margaret","Alice","Beatrice","Dorothy","Agnes","Rose","Irene"];
 const last=["Ward","Blackwood","Marsh","Gilman","Derby","Carter","Whateley","Armitage","Danforth","Pickman","Waite","Talbot","Peaslee","Curwen"];
 const jobs=[
  {name:"Détective privé",focus:["Investigation","Armes"]},
  {name:"Médecin",focus:["Médecine","Psychologie"]},
  {name:"Professeur",focus:["Érudition","Occultisme"]},
  {name:"Journaliste",focus:["Investigation","Psychologie"]},
  {name:"Marin",focus:["Endurance","Armes"]},
  {name:"Antiquaire",focus:["Occultisme","Érudition"]},
  {name:"Photographe",focus:["Observation","Investigation"]},
  {name:"Infirmière",focus:["Médecine","Observation"]},
  {name:"Bibliothécaire",focus:["Érudition","Investigation"]},
  {name:"Inspecteur de police",focus:["Armes","Observation"]}
 ];
 const traits=["Sang-froid","Curieux","Méfiant","Insomniaque","Œil exercé","Volonté de fer","Superstitieux","Cicatrice étrange","Empathique","Obsessionnel"];
 const skills=["Investigation","Observation","Armes","Médecine","Psychologie","Occultisme","Érudition","Endurance"];

 function makeChar(){
   const female=Math.random()<.5, pool=female?firstF:firstM, job=jobs[Math.floor(Math.random()*jobs.length)];
   let vals=Object.fromEntries(skills.map(s=>[s,35]));
   vals[job.focus[0]]+=35; vals[job.focus[1]]+=25;
   let remain=60;
   while(remain-->0){vals[skills[Math.floor(Math.random()*skills.length)]]++}
   return {name:pool[Math.floor(Math.random()*pool.length)]+" "+last[Math.floor(Math.random()*last.length)],
           sex:female?"Femme":"Homme",job:job.name,trait:traits[Math.floor(Math.random()*traits.length)],skills:vals}
 }
 window.cdChar082=makeChar();

 function drawChar(){
   const box=document.getElementById("char080"); if(!box)return;
   const c=window.cdChar082;
   box.innerHTML="<h3>👤 FEUILLE DE PERSONNAGE</h3>"+
   "<p><b>"+c.name+"</b> · "+c.sex+" · <b>"+c.job+"</b> · Trait : <b>"+c.trait+"</b></p>"+
   "<p style='color:#959cab'>Total compétences : <b>400</b></p>"+
   "<div class='skills'>"+Object.entries(c.skills).map(([s,v])=>"<div class='skillrow'><span>"+s+"</span><b>"+v+"</b><div class='skillbar'><i style='width:"+v+"%'></i></div></div>").join("")+"</div>";
 }
 window.drawChar082=drawChar;

 document.addEventListener("click",e=>{
   const t=(e.target.textContent||"").trim();
   if(/NOUVELLE RÉALITÉ/i.test(t)){window.cdChar082=makeChar();setTimeout(drawChar,50)}
   if(/PERSONNAGE/i.test(t))setTimeout(drawChar,20);
 },true);
 document.addEventListener("DOMContentLoaded",()=>setTimeout(drawChar,120));

 function toast(msg){
   let t=document.getElementById("toast082");
   if(!t){t=document.createElement("div");t.id="toast082";Object.assign(t.style,{position:"fixed",left:"50%",bottom:"18px",transform:"translateX(-50%)",zIndex:"100000",background:"#20242d",border:"1px solid #626978",borderRadius:"10px",padding:"10px 14px",color:"#fff",fontFamily:"monospace"});document.body.appendChild(t)}
   t.textContent=msg;t.style.display="block";clearTimeout(t._x);t._x=setTimeout(()=>t.style.display="none",1500)
 }
 document.addEventListener("click",e=>{
   const b=e.target.closest("button"); if(!b)return;
   const txt=(b.textContent||"").trim();
   if(!/UTILISER|ÉQUIPER|DÉSÉQUIPER|JETER/.test(txt))return;
   const entry=b.closest(".entry"); if(!entry)return;
   const title=(entry.querySelector("b")?.textContent||"Objet").replace(/×\d+/g,"").replace(/ÉQUIPÉ.*$/,"").trim();
   setTimeout(()=>toast((/JETER/.test(txt)?"Jeté : ":/DÉSÉQUIPER/.test(txt)?"Déséquipé : ":/ÉQUIPER/.test(txt)?"Équipé : ":"Utilisé : ")+title),30);
 },true);
})();
</script>


<script id="consolidated-js-083">
(function(){
  const $=id=>document.getElementById(id);

  function oldButton(regex){
    return [...document.querySelectorAll("#app button")].find(b=>regex.test((b.textContent||"").trim()));
  }
  function fire(regex){
    const b=oldButton(regex);
    if(b)b.click();
  }

  // tactile movement remains connected to actual game actions
  if($("jU"))$("jU").onclick=()=>fire(/^▲$/);
  if($("jD"))$("jD").onclick=()=>fire(/^▼$/);
  if($("jL"))$("jL").onclick=()=>fire(/^◀$/);
  if($("jR"))$("jR").onclick=()=>fire(/^▶$/);
  if($("jC"))$("jC").onclick=()=>fire(/ENQUÊTER/i);
  if($("act080"))$("act080").onclick=()=>fire(/ENQUÊTER/i);

  // Menu controls
  const menu=$("rpgMenu080");
  if($("menu080"))$("menu080").onclick=()=>{menu.classList.add("open"); if(window.drawChar082)window.drawChar082();};
  if($("closeMenu080"))$("closeMenu080").onclick=()=>menu.classList.remove("open");

  // Make menu buttons call actual existing game functions, not dead placeholders.
  const bindByText=(rx,fn)=>{
    const b=[...menu.querySelectorAll("button")].find(x=>rx.test((x.textContent||"").trim()));
    if(b)b.onclick=fn;
  };
  bindByText(/INVENTAIRE/i,()=>{menu.classList.remove("open"); if(typeof openInventory==="function")openInventory();});
  bindByText(/BESTIAIRE/i,()=>{menu.classList.remove("open"); if(typeof openCodex==="function")openCodex();});
  bindByText(/GUIDE OBJETS/i,()=>{menu.classList.remove("open"); if(typeof openItems==="function")openItems();});
  bindByText(/SUCCÈS/i,()=>{menu.classList.remove("open"); if(typeof openAchievements==="function")openAchievements();});
  bindByText(/NOUVELLE RÉALITÉ/i,()=>{
    menu.classList.remove("open");
    if(typeof newGame==="function")newGame();
    if(window.cdChar082&&window.makeChar083)window.cdChar082=window.makeChar083();
  });

  // Actual per-run character generation with equal point total.
  const firstM=["Elias","Walter","Edwin","Arthur","Samuel","Thomas","Henry","Nathaniel","Silas","George","Howard","Francis"];
  const firstF=["Clara","Evelyn","Mabel","Helen","Edith","Margaret","Alice","Beatrice","Dorothy","Agnes","Rose","Irene"];
  const last=["Ward","Blackwood","Marsh","Gilman","Derby","Carter","Whateley","Armitage","Danforth","Pickman","Waite","Talbot","Peaslee","Curwen"];
  const jobs=[
    {name:"Détective privé",focus:["Investigation","Armes"]},
    {name:"Médecin",focus:["Médecine","Psychologie"]},
    {name:"Professeur",focus:["Érudition","Occultisme"]},
    {name:"Journaliste",focus:["Investigation","Psychologie"]},
    {name:"Marin",focus:["Endurance","Armes"]},
    {name:"Antiquaire",focus:["Occultisme","Érudition"]},
    {name:"Photographe",focus:["Observation","Investigation"]},
    {name:"Infirmière",focus:["Médecine","Observation"]},
    {name:"Bibliothécaire",focus:["Érudition","Investigation"]},
    {name:"Inspecteur de police",focus:["Armes","Observation"]}
  ];
  const traits=["Sang-froid","Curieux","Méfiant","Insomniaque","Œil exercé","Volonté de fer","Superstitieux","Cicatrice étrange","Empathique","Obsessionnel"];
  const skills=["Investigation","Observation","Armes","Médecine","Psychologie","Occultisme","Érudition","Endurance"];

  function makeChar(){
    const female=Math.random()<.5, pool=female?firstF:firstM;
    const job=jobs[Math.floor(Math.random()*jobs.length)];
    let vals=Object.fromEntries(skills.map(s=>[s,35]));
    vals[job.focus[0]]+=35; vals[job.focus[1]]+=25;
    let remain=60;
    while(remain-->0) vals[skills[Math.floor(Math.random()*skills.length)]]++;
    return {
      name:pool[Math.floor(Math.random()*pool.length)]+" "+last[Math.floor(Math.random()*last.length)],
      sex:female?"Femme":"Homme",
      job:job.name,
      trait:traits[Math.floor(Math.random()*traits.length)],
      skills:vals
    };
  }
  window.makeChar083=makeChar;
  window.cdChar082=makeChar();

  window.drawChar082=function(){
    const box=$("char080"); if(!box)return;
    const c=window.cdChar082;
    box.innerHTML="<h3>👤 FEUILLE DE PERSONNAGE</h3>"+
      "<p><b>"+c.name+"</b> · "+c.sex+" · <b>"+c.job+"</b> · Trait : <b>"+c.trait+"</b></p>"+
      "<p style='color:#959cab'>Total compétences : <b>400 points</b></p>"+
      "<div class='skills'>"+
      Object.entries(c.skills).map(([s,v])=>"<div class='skillrow'><span>"+s+"</span><b>"+v+"</b><div class='skillbar'><i style='width:"+v+"%'></i></div></div>").join("")+
      "</div>";
  };

  // Regenerate character exactly when newGame is called through UI.
  const originalNewGame=window.newGame;
  if(typeof originalNewGame==="function"){
    window.newGame=function(){
      const r=originalNewGame.apply(this,arguments);
      window.cdChar082=makeChar();
      setTimeout(()=>window.drawChar082(),20);
      return r;
    };
  }

  // Force map render after startup / orientation.
  function refresh(){
    try{if(typeof render==="function"&&typeof p!=="undefined"&&p)render();}catch(e){}
  }
  addEventListener("orientationchange",()=>setTimeout(refresh,150));
  addEventListener("resize",()=>setTimeout(refresh,80));
  addEventListener("DOMContentLoaded",()=>setTimeout(refresh,180));
})();
</script>
