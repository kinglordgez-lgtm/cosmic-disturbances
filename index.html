function generateMap(){

 {n:"Chapelle noyée",txt:"Des bancs gonflés d'eau entourent un autel couvert de sel.",san:-1,myth:1},
 {n:"Archives murées",txt:"Des registres municipaux portent des dates qui n'existent pas.",xp:1},
 {n:"Morgue abandonnée",txt:"Une étiquette porte votre propre nom.",san:-2},
 {n:"Cave aux marées",txt:"L'eau monte et descend sans relation avec la mer.",myth:1},
 {n:"Observatoire condamné",txt:"Une lunette vise une constellation absente du ciel.",xp:1,myth:1},
 {n:"Appartement silencieux",txt:"Une table est dressée pour des habitants disparus depuis trente ans.",san:-1}
];
const cd27Secrets=[
 "Une brique descellée révèle un carnet couvert de coordonnées.",
 "Un courant d'air trahit un passage derrière la maçonnerie.",
 "Sous une lame de parquet repose un symbole gravé à l'envers.",
 "Une photographie montre cette pièce avant sa construction.",
 "Des traces humides s'arrêtent brusquement au milieu du mur."
];
let cd27Visited={};
function cd27Key(){return player.depth+":"+px+":"+py}
function cd27Explore(){
 if(!player||battle)return false;
 const k=cd27Key(); if(cd27Visited[k])return false;
 // Rare enough to enrich exploration without overwhelming the existing event system.
 if(rng()>.16)return false;
 cd27Visited[k]=true;
 const r=cd27Rooms[R(cd27Rooms.length)];
 log("LIEU — "+r.n+" : "+r.txt);
 if(r.san){player.san=Math.max(0,player.san+r.san)}
 if(r.myth){player.myth=Math.min(100,player.myth+r.myth)}
 if(r.xp){player.xp+=r.xp}
 toast(r.n);
 if(rng()<.32){
   const secret=cd27Secrets[R(cd27Secrets.length)];
   log("SECRET — "+secret);
   player.xp+=1;
 }
 return true
}
function cd27DepthAtmosphere(){
 if(!player)return;
 const d=player.depth||0;
 if(d>=6)return "Les rues semblent se replier autour de vous.";
 if(d>=4)return "Blackwater paraît plus ancienne à chaque pas.";
 if(d>=2)return "L'air devient humide et chargé d'iode.";
 return "La ville paraît calme, mais quelque chose observe.";
}
const cd27OldMove=move;
move=function(dx,dy){
 const ox=px,oy=py;
 cd27OldMove(dx,dy);
 if(!battle&&(px!==ox||py!==oy)){
   cd27Explore();
   if(rng()<.035)log("ATMOSPHÈRE — "+cd27DepthAtmosphere());
   render();
 }
};
const cd27OldNewFloor=(typeof nextFloor==="function"?nextFloor:null);
if(cd27OldNewFloor){
 nextFloor=function(){
   cd27OldNewFloor.apply(this,arguments);
   cd27Visited={};
   log("PROFONDEUR — "+cd27DepthAtmosphere());
   render();
 }
}


/* === V0.28.0 : identités PNJ + dialogues contextuels === */
const cd28NpcJobs=["Archiviste","Docker","Infirmière","Policier","Libraire","Pêcheur","Employée de morgue","Professeur"];
const cd28NpcMoods=["nerveux","méfiant","épuisé","superstitieux","pressé","hagard"];
const cd28NpcLines={
 Archiviste:["Les registres ont été corrigés. Pas par une main humaine.","Certaines rues disparaissent des plans après minuit."],
 Docker:["Des caisses arrivent sans manifeste depuis trois nuits.","J'ai entendu quelque chose respirer sous le quai."],
 Infirmière:["Les noyés ont du sel sous les paupières.","Certains patients rêvent tous de la même porte."],
 Policier:["On nous ordonne d'éviter les quais après la tombée du jour.","Les rapports disparaissent avant d'être classés."],
 Libraire:["Un client cherche des ouvrages qui n'ont jamais été imprimés.","Les marges de certains livres changent pendant la nuit."],
 Pêcheur:["La mer rejette des poissons sans yeux.","Ne suivez jamais les cloches quand la brume tombe."],
 "Employée de morgue":["Un corps a changé de place tout seul cette nuit.","Il manque des dents sur tous les noyés."],
 Professeur:["Les angles de cette ville ne respectent plus la géométrie.","Une constellation inconnue apparaît dans mes calculs."]
};
function cd28NpcIdentity(n){
 if(!n)return null;
 if(!n.cd28){
   const job=n.job||cd28NpcJobs[R(cd28NpcJobs.length)];
   const mood=n.mood||cd28NpcMoods[R(cd28NpcMoods.length)];
   n.cd28={job,mood,line:cd28NpcLines[job]?.[R((cd28NpcLines[job]||["Je ne sais rien."]).length)]||"Je ne sais rien."};
 }
 return n.cd28;
}
function cd28ContextLine(n,choice){
 const x=cd28NpcIdentity(n); if(!x)return "";
 const q=player&&player.quest&&!player.quest.done?player.quest.title:null;
 if(choice==="questionner"&&q)return x.line+" Cela pourrait concerner « "+q+" ».";
 if(choice==="rassurer")return "Après une hésitation, "+(n.name||"le témoin")+" murmure : « "+x.line+" »";
 if(choice==="menacer")return "Sous la pression, "+(n.name||"le témoin")+" lâche : « "+x.line+" »";
 return x.line;
}
/* Enrichit les PNJ existants sans remplacer le moteur de dialogue stable. */
if(typeof openNpc==="function"){
 const cd28OpenNpc=openNpc;
 openNpc=function(){
   const r=cd28OpenNpc.apply(this,arguments);
   try{
     const n=player&&player.npc;
     if(n){
       const x=cd28NpcIdentity(n);
       const modal=document.querySelector("#modal .body,#modalBody,.modalBody");
       if(modal&&!modal.querySelector(".cd28npc")){
         const d=document.createElement("div"); d.className="cd28npc";
         d.style.cssText="margin:8px 0 12px;opacity:.8;font-size:.82em";
         d.textContent=x.job+" · "+x.mood;
         modal.prepend(d);
       }
     }
   }catch(e){console.warn("cd28 npc display",e)}
   return r;
 }
}


/* === V0.29.0 : anti-softlock + dialogues réellement contextuels === */
function cd29Walkable(x,y){
 return y>=0&&y<map.length&&x>=0&&map[y]&&x<map[y].length&&map[y][x]!=="wall";
}
function cd29ReachableFrom(sx,sy){
 const seen=new Set([sx+","+sy]), q=[[sx,sy]];
 while(q.length){
  const [x,y]=q.shift();
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
   const nx=x+dx,ny=y+dy,k=nx+","+ny;
   if(!seen.has(k)&&cd29Walkable(nx,ny)){seen.add(k);q.push([nx,ny])}
  }
 }
 return seen;
}
function cd29EnsureCriticalAccess(){
 if(!map||!map.length)return;
 const seen=cd29ReachableFrom(px,py);
 let exit=null;
 for(let y=0;y<map.length;y++)for(let x=0;x<map[y].length;x++){
   if(map[y][x]==="exit")exit={x,y};
 }
 if(exit&&!seen.has(exit.x+","+exit.y)){
   // Put the exit on a reachable floor tile far from the player.
   let cand=[];
   for(const k of seen){
     const [x,y]=k.split(",").map(Number);
     if(map[y][x]==="floor" && Math.abs(x-px)+Math.abs(y-py)>=5)cand.push({x,y});
   }
   if(!cand.length)for(const k of seen){
     const [x,y]=k.split(",").map(Number);
     if(map[y][x]==="floor")cand.push({x,y});
   }
   if(cand.length){
     map[exit.y][exit.x]="floor";
     const c=cand[R(cand.length)]; map[c.y][c.x]="exit";
     log("GÉNÉRATION — Une issue inaccessible a été repositionnée.");
   }
 }
 // Critical active quest target must also have at least one reachable instance.
 if(player&&player.quest&&!player.quest.done&&typeof currentQuestStep==="function"){
   const st=currentQuestStep(), icon=st&&st.icon;
   if(icon){
     let ok=false;
     for(const k of seen){const [x,y]=k.split(",").map(Number); if(map[y][x]===icon){ok=true;break}}
     if(!ok){
       const floors=[...seen].map(k=>k.split(",").map(Number)).filter(([x,y])=>map[y][x]==="floor"&&Math.abs(x-px)+Math.abs(y-py)>2);
       if(floors.length){const [x,y]=floors[R(floors.length)];map[y][x]=icon;log("GÉNÉRATION — L'objectif de quête a été rendu accessible.");}
     }
   }
 }
}
const cd29OldGenerate=(typeof genMap==="function"?genMap:null);
if(cd29OldGenerate){
 genMap=function(){const r=cd29OldGenerate.apply(this,arguments);cd29EnsureCriticalAccess();return r}
}
const cd29OldRender=(typeof render==="function"?render:null);
let cd29Guard=false;
if(cd29OldRender){
 render=function(){
  if(!cd29Guard){cd29Guard=true;try{cd29EnsureCriticalAccess()}catch(e){console.warn("cd29 access",e)}cd29Guard=false}
  return cd29OldRender.apply(this,arguments)
 }
}

/* Dialogue: visible response + consequence depending on choice. */
function cd29DialogueOutcome(choice){
 const n=player&&player.npc;if(!n)return;
 const x=typeof cd28NpcIdentity==="function"?cd28NpcIdentity(n):{job:n.job||"Habitant",mood:n.mood||"méfiant",line:"Quelque chose rôde dans Blackwater."};
 let skill=choice==="questionner"?"Investigation":choice==="rassurer"?"Psychologie":choice==="menacer"?"Endurance":null;
 if(!skill)return;
 const success=typeof skillCheck==="function"?skillCheck(skill,choice==="menacer"?12:10):true;
 let text;
 if(success){
   text=(typeof cd28ContextLine==="function"?cd28ContextLine(n,choice):x.line);
   n.trust=(n.trust||0)+(choice==="rassurer"?2:1);
   player.xp+=1;
   if(choice==="menacer"){player.san=Math.max(0,player.san-1);text+=" Votre brutalité laisse une trace."}
   log("DIALOGUE — "+(n.name||x.job)+" : "+text+" +1 XP.");
 }else{
   n.trust=(n.trust||0)-(choice==="menacer"?2:1);
   const fails={
    questionner:"Le témoin élude vos questions et change de sujet.",
    rassurer:"Vos paroles ne dissipent pas sa peur.",
    menacer:"Le témoin se ferme complètement et refuse d'en dire davantage."
   };
   log("DIALOGUE — "+(fails[choice]||"La conversation tourne court."));
 }
 renderQuestTracker();
 render();
}


/* === V0.30.0 : biomes/profondeurs + mini-boss procéduraux === */
const cd30Biomes=[
 {min:0,n:"Rues de Blackwater",desc:"Façades humides, ruelles étroites et lampes vacillantes."},
 {min:2,n:"Quartier des quais",desc:"L'iode, les entrepôts et le ressac étouffent les bruits de pas."},
 {min:4,n:"Sous-sols noyés",desc:"La pierre suinte. Des tunnels plus anciens que la ville s'enfoncent sous l'eau."},
 {min:6,n:"Catacombes cyclopéennes",desc:"Les angles deviennent faux et les inscriptions ne semblent plus humaines."},
 {min:8,n:"Seuil de l'Indicible",desc:"L'espace lui-même paraît malade. Blackwater n'est peut-être plus au-dessus de vous."}
];
function cd30Biome(){
 const d=(player&&player.depth)||0;
 let b=cd30Biomes[0];for(const x of cd30Biomes)if(d>=x.min)b=x;return b;
}
let cd30LastDepth=-1;
function cd30AnnounceDepth(){
 if(!player||player.depth===cd30LastDepth)return;
 cd30LastDepth=player.depth;
 const b=cd30Biome();
 log("ZONE — "+b.n+" : "+b.desc);
 toast(b.n);
}
const cd30OldRender=render;
render=function(){
 cd30AnnounceDepth();
 return cd30OldRender.apply(this,arguments);
};

/* Elite/mini-boss depth scaling without altering normal combat flow. */
const cd30Titles=["Abomination","Gardien","Héraut","Dévoreur","Veilleur"];
function cd30PromoteEnemy(){
 if(!enemy||enemy.elite||battle!==true)return;
 const d=(player&&player.depth)||0;
 if(d<3||rng()>.10)return;
 const base=enemy.base||enemy.name;
 enemy.base=base;
 enemy.elite=true;
 enemy.name=cd30Titles[R(cd30Titles.length)]+" — "+base;
 enemy.maxhp=Math.max(enemy.maxhp||enemy.hp,Math.round(enemy.hp*(1.45+d*.04)));
 enemy.hp=enemy.maxhp;
 enemy.atk=Math.max(1,(enemy.atk||1)+1+Math.floor(d/4));
 enemy.weak=enemy.weak||(creatures[base]&&creatures[base].weak);
 enemy.resist=enemy.resist||(creatures[base]&&creatures[base].resist);
 log("PRÉSENCE MAJEURE — "+enemy.name+" bloque votre route.");
 toast("MINI-BOSS");
}
const cd30OldSpawn=spawnEnemy;
spawnEnemy=function(){
 const r=cd30OldSpawn.apply(this,arguments);
 try{cd30PromoteEnemy()}catch(e){console.warn("cd30 elite",e)}
 renderContext();
 return r;
};

/* Rewards are additive and safe. */
const cd30OldWin=win;
win=function(){
 const wasElite=!!(enemy&&enemy.elite), eliteName=enemy&&enemy.name;
 const r=cd30OldWin.apply(this,arguments);
 if(wasElite&&player){
   player.xp+=3;
   if(rng()<.45){
     const rewards=["Sel consacré","Bandage militaire","Craie rituelle","Cartouches d'argent"];
     const n=rewards[R(rewards.length)];
     player.inv.push({n}); if(typeof seenItems!=="undefined")seenItems[n]=true;
     log("TROPHÉE — "+eliteName+" laisse : "+n+". +3 XP.");
   }else log("TROPHÉE — "+eliteName+" vaincu. +3 XP.");
   render();
 }
 return r;
};


/* === V0.31.0 : anomalies de profondeur + exploration à risque/récompense === */
const cd31Anomalies=[
 {min:1,name:"Brouillard saumâtre",text:"Un brouillard froid avale les repères.",san:1},
 {min:2,name:"Chant sous les quais",text:"Une mélodie impossible remonte des eaux noires.",san:2},
 {min:4,name:"Géométrie malade",text:"Les murs semblent changer d'angle lorsque vous détournez les yeux.",san:2},
 {min:6,name:"Spores inconnues",text:"Une poussière pâle flotte dans l'air immobile.",hp:2},
 {min:8,name:"Regard extérieur",text:"Quelque chose, très loin derrière le monde, vous remarque.",san:3,myth:1}
];
let cd31Steps=0, cd31LastAnomaly=-99;
function cd31Depth(){return (player&&player.depth)||0}
function cd31Eligible(){
 const d=cd31Depth();
 return cd31Anomalies.filter(a=>d>=a.min);
}
function cd31Anomaly(){
 if(!player||battle||cd31Depth()<1||cd31Steps-cd31LastAnomaly<9||rng()>.10)return;
 const pool=cd31Eligible(); if(!pool.length)return;
 const a=pool[R(pool.length)]; cd31LastAnomaly=cd31Steps;
 if(a.san) player.san=Math.max(0,player.san-a.san);
 if(a.hp) player.hp=Math.max(1,player.hp-a.hp);
 if(a.myth) player.myth=Math.min(100,(player.myth||0)+a.myth);
 log("ANOMALIE — "+a.name+" : "+a.text+
     (a.san?" -"+a.san+" SAN.":"")+(a.hp?" -"+a.hp+" PV.":"")+(a.myth?" +"+a.myth+"% Mythe.":""));
 toast("ANOMALIE : "+a.name);
}
const cd31OldMove=move;
move=function(dx,dy){
 const ox=px,oy=py;
 const r=cd31OldMove.apply(this,arguments);
 if(px!==ox||py!==oy){cd31Steps++; try{cd31Anomaly()}catch(e){console.warn("cd31 anomaly",e)}}
 return r;
};

/* Investigation gains depth-dependent discoveries, without replacing existing tile logic. */
const cd31Discoveries=[
 "Une date est gravée plusieurs fois, avec des décennies d'écart.",
 "Des traces humides s'arrêtent brutalement au milieu du passage.",
 "Une odeur d'iode persiste loin de toute eau.",
 "Les mêmes trois initiales apparaissent sur des pierres d'époques différentes.",
 "Votre ombre accuse un léger retard.",
 "Un courant d'air vient d'un mur parfaitement plein.",
 "Quelqu'un a dessiné Blackwater avec une rue qui n'existe pas.",
 "Une prière est écrite à l'envers dans une langue que vous comprenez pourtant."
];
const cd31OldInvestigate=investigate;
investigate=function(){
 const beforeMyth=player&&player.myth;
 const r=cd31OldInvestigate.apply(this,arguments);
 if(player&&!battle&&cd31Depth()>=2&&rng()<.16){
   const clue=cd31Discoveries[R(cd31Discoveries.length)];
   log("INDICE ÉTRANGE — "+clue);
   if(rng()<.30){
     player.myth=Math.min(100,(player.myth||0)+1);
     log("Votre compréhension de l'inconnu progresse. +1% Mythe.");
   }
 }
 return r;
};

/* Deep-level pressure: enemies receive a modest, bounded scaling.
   Existing elites/mini-bosses remain compatible. */
const cd31OldSpawn=spawnEnemy;
spawnEnemy=function(){
 const r=cd31OldSpawn.apply(this,arguments);
 if(enemy&&battle){
   const d=cd31Depth();
   const bonus=Math.min(5,Math.floor(d/2));
   if(bonus>0&&!enemy.cd31scaled){
     enemy.cd31scaled=true;
     enemy.atk=(enemy.atk||1)+Math.floor(bonus/2);
     const extra=bonus*2;
     enemy.hp=(enemy.hp||1)+extra;
     enemy.maxhp=(enemy.maxhp||enemy.hp)+extra;
   }
 }
 renderContext();
 return r;
};
