<script>
"use strict";
let seed,rng,map,px,py,player,enemy=null,battle=false,journal=[],codex={},seenItems={},ach={};


const creatures={

 "Veilleur sans visage":{hp:25,atk:7,cat:"Mythe",desc:"Humanoïde qui semble exister seulement lorsqu'on détourne les yeux.",weak:"observation",resist:"métal"},
 "Chien de Tindalos":{hp:29,atk:9,cat:"Mythe",desc:"Prédateur venu des angles du temps.",weak:"symbole",resist:"balles"},
 "Polype rampant":{hp:31,atk:9,cat:"Mythe",desc:"Vestige d'une espèce préhumaine associée aux vents souterrains.",weak:"occultisme",resist:"physique"},
 "Cultiste de Dagon":{hp:18,atk:6,cat:"Humain",desc:"Adepte des rites marins de l'Ordre Ésotérique.",weak:"psychologie",resist:"occulte"}
};
const itemDB={
 "Lampe à pétrole":{type:"Outil",slot:"outil",rarity:"Commun",desc:"Restaure 6 SAN. Deux charges.",tags:"feu, lumière"},
 "Vieux revolver":{type:"Arme",slot:"arme",rarity:"Commun",desc:"+2 dégâts lorsqu’il est équipé.",tags:"bruit, métal"},
 "Bandage militaire":{type:"Consommable",rarity:"Commun",desc:"Restaure 8 PV.",tags:"soin"},
 "Sel consacré":{type:"Consommable",rarity:"Inhabituel",desc:"Inflige 8 dégâts à une créature du Mythe.",tags:"rituel, sel"},
 "Fragment noir":{type:"Relique",slot:"relique",rarity:"Rare",desc:"Accroît le Mythe au prix de la SAN.",tags:"cosmique, maudit"},
 "Symbole gravé":{type:"Relique",slot:"relique",rarity:"Inhabituel",desc:"Relique occulte équipable. Efficace contre certaines entités.",tags:"occulte, ancien"},
 "Cartouches d'argent":{type:"Munition",rarity:"Inhabituel",desc:"La prochaine attaque gagne +3 dégâts.",tags:"argent, métal"},
 "Laudanum trouble":{type:"Consommable",rarity:"Commun",desc:"Restaure 5 SAN, avec un risque de perdre 2 PV.",tags:"soin, drogue"},
 "Clé de la morgue":{type:"Objet de quête",rarity:"Inhabituel",desc:"Clé glacée portant le sceau municipal de Blackwater.",tags:"clé, morgue"},
 "Lentille de Mi-Go":{type:"Outil",slot:"outil",rarity:"Rare",desc:"Facilite certains tests d'Observation.",tags:"mi-go, optique"},
 "Idole d'obsidienne":{type:"Relique",slot:"relique",rarity:"Rare",desc:"Objet occulte qui renforce les connaissances interdites.",tags:"occulte, maudit"},
 "Carnet détrempé":{type:"Indice",rarity:"Commun",desc:"Facilite certaines recherches d'Investigation.",tags:"indice, écrit"},

 "Craie rituelle":{type:"Consommable",rarity:"Inhabituel",desc:"Protection temporaire : +3 DEF.",tags:"rituel, protection"}
};

const firstM=["Elias","Walter","Edwin","Arthur","Samuel","Thomas","Henry","Nathaniel","Silas","George"];
const firstF=["Clara","Evelyn","Mabel","Helen","Edith","Margaret","Alice","Beatrice","Dorothy","Agnes"];
const lastN=["Ward","Blackwood","Marsh","Gilman","Derby","Carter","Whateley","Armitage","Danforth","Pickman","Waite"];
const jobs=[
 {m:"Détective privé",f:"Détective privée",focus:["Investigation","Armes"]},
 {m:"Médecin",f:"Médecin",focus:["Médecine","Psychologie"]},
 {m:"Professeur",f:"Professeure",focus:["Érudition","Occultisme"]},
 {m:"Journaliste",f:"Journaliste",focus:["Investigation","Psychologie"]},
 {m:"Marin",f:"Marine",focus:["Endurance","Armes"]},
 {m:"Antiquaire",f:"Antiquaire",focus:["Occultisme","Érudition"]},
 {m:"Photographe",f:"Photographe",focus:["Observation","Investigation"]},
 {m:"Infirmier",f:"Infirmière",focus:["Médecine","Observation"]}
];
const traits=["Sang-froid","Curieux","Méfiant","Insomniaque","Œil exercé","Volonté de fer","Superstitieux","Cicatrice étrange"];
const skills=["Investigation","Observation","Armes","Médecine","Psychologie","Occultisme","Érudition","Endurance"];

function mulberry(a){return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function R(n){return Math.floor(rng()*n)}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";clearTimeout(t._x);t._x=setTimeout(()=>t.style.display="none",1500)}
function log(s){journal.unshift(s);journal=journal.slice(0,60)}
function closeOverlays(){document.querySelectorAll(".overlay").forEach(o=>o.classList.remove("open"))}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove("open"));
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.classList.remove("open")}));

function makeCharacter(){
 const female=Math.random()<.5,pool=female?firstF:firstM,job=jobs[Math.floor(Math.random()*jobs.length)];
 let v=Object.fromEntries(skills.map(s=>[s,35]));v[job.focus[0]]+=35;v[job.focus[1]]+=25;let rem=60;
 while(rem-->0)v[skills[Math.floor(Math.random()*skills.length)]]++;
 return {name:pool[Math.floor(Math.random()*pool.length)]+" "+lastN[Math.floor(Math.random()*lastN.length)],sex:female?"Femme":"Homme",job:female?job.f:job.m,trait:traits[Math.floor(Math.random()*traits.length)],skills:v}
}
function newRun(){
 closeOverlays();seed=100000+Math.floor(Math.random()*899999);rng=mulberry(seed);
 player={hp:34,maxhp:34,san:34,maxsan:34,myth:0,atk:5,def:1,lvl:1,xp:0,depth:0,char:makeCharacter(),equip:{arme:"Vieux revolver",outil:"Lampe à pétrole",relique:null},inv:[{n:"Lampe à pétrole",uses:2},{n:"Vieux revolver"}],quest:null,reputation:0};
 seenItems["Lampe à pétrole"]=seenItems["Vieux revolver"]=true;enemy=null;battle=false;journal=[];generateMap();if(typeof cd14GenerateGeometry==='function')cd14GenerateGeometry();log("Nouvelle réalité. Seed "+seed+".");log("Blackwater semble connaître votre nom.");if(Math.random()<.35)startQuest();render()
}
function generateMap(){
 map=Array.from({length:13},()=>Array(13).fill("wall"));let x=6,y=6;map[y][x]="floor";
 for(let i=0;i<200;i++){let d=R(4);x=Math.max(1,Math.min(11,x+(d===0?1:d===1?-1:0)));y=Math.max(1,Math.min(11,y+(d===2?1:d===3?-1:0)));map[y][x]="floor";if(rng()<.15){if(x<11)map[y][x+1]="floor";if(y<11)map[y+1][x]="floor"}}
 let floors=[];for(let yy=1;yy<12;yy++)for(let xx=1;xx<12;xx++)if(map[yy][xx]==="floor")floors.push([xx,yy]);

 const q=player.quest,old=currentQuestStep();q.history.push("Échec : "+old.objective+" — "+reason);

 else{const alt=questTemplates().filter(x=>x.title!==q.title),nq=alt[R(alt.length)];player.quest={...nq,step:0,done:false,history:[`La piste « ${q.title} » s'est refermée.`]};log("Une autre piste s'ouvre : "+player.quest.title+" — "+currentQuestStep().objective+".");toast("Nouvelle piste")}
}

 log("LA PISTE BIFURQUE : "+b[0]+".");toast("Nouvelle piste");renderQuestTracker();return true
}
function cd17ShowHistory(){
 if(!player.quest){toast("Aucune enquête");return}
 document.getElementById("overlay").classList.add("show");document.getElementById("overlayTitle").textContent="CARNET D'ENQUÊTE";
 document.getElementById("overlayBody").innerHTML=`<div class=entry><b>${player.quest.title}</b><br><br>${(player.quest.history||[]).slice(-8).map(x=>"• "+x).join("<br>")||"Aucun événement majeur."}</div>`
}
</script>

<script id="npc-0180">
const CD18_NAMES=["Abigail Crane","Jonas Reed","Martha Bell","Isaac Webb","Eleanor Shaw","Caleb Price","Ruth Harker","Silas Cole","Edith Warren","Nathan Briggs"];
const CD18_ROLES=["Docker","Veuve","Policier","Médecin","Sacristain","Pêcheur","Archiviste","Infirmière","Gardien","Journaliste"];
const CD18_MOODS=["terrifié","méfiant","épuisé","agité","résigné","fiévreux"];
const CD18_RUMORS=[
 "Des chants montent des égouts à marée basse.",
 "Le sanatorium recevait des patients qui n'existaient sur aucun registre.",
 "Une lumière verte a été vue au-dessus des entrepôts.",
 "Le vieux phare s'est éteint avant la disparition des pêcheurs.",
 "Des gens entrent dans l'église la nuit, mais personne n'en ressort.",
 "Une famille du quai ne ferme jamais ses rideaux depuis trois générations."
];
function cd18NPC(){
 return {name:CD18_NAMES[R(CD18_NAMES.length)],role:CD18_ROLES[R(CD18_ROLES.length)],mood:CD18_MOODS[R(CD18_MOODS.length)],trust:R(3)-1,rumor:CD18_RUMORS[R(CD18_RUMORS.length)]}
}
function cd18Talk(mode){
 if(!player.npc)player.npc=cd18NPC();const n=player.npc;
 let sk="Psychologie",dc=13;
 if(mode==="questionner"){sk="Investigation";dc=13}
 if(mode==="rassurer"){sk="Psychologie";dc=11}
 if(mode==="menacer"){sk="Armes";dc=15}
 const ok=skillCheck(sk,dc);
 if(ok){
   n.trust+=(mode==="menacer"?0:1);
   log(n.name+" ("+n.role+") : « "+n.rumor+" »");
   if(mode==="rassurer")player.san=Math.min(player.maxsan,player.san+1);
   if(player.quest&&rng()<.38){log("Cette information éclaire votre enquête.");player.xp+=2}
   toast("Information obtenue")
 }else{
   n.trust--;
   if(mode==="menacer"){log(n.name+" refuse de parler et appelle à l'aide.");if(rng()<.45)spawnEnemy()}
   else log(n.name+" se referme. Votre approche a échoué.");
   toast("Échec social")
 }
 render()
}
function cd18NpcPanel(){
 if(!player.npc)player.npc=cd18NPC();const n=player.npc;
 document.getElementById("overlay").classList.add("show");
 document.getElementById("overlayTitle").textContent=n.name.toUpperCase();
 document.getElementById("overlayBody").innerHTML=`<div class=entry><b>${n.role}</b> · ${n.mood}<br>Confiance : ${n.trust}</div>
 <div class=grid2><button onclick="cd18Talk('questionner')">QUESTIONNER</button><button onclick="cd18Talk('rassurer')">RASSURER</button><button onclick="cd18Talk('menacer')">MENACER</button><button onclick="player.npc=null;closeOverlays()">PARTIR</button></div>`
}
</script>
